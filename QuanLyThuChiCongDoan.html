<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quản lý Thu - Chi Công đoàn cơ sở</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: "Segoe UI", Arial, sans-serif; font-size: 14px; color: #1f2937; background: #f3f4f6; }
#app { display: flex; min-height: 100vh; }

/* ===== Sidebar ===== */
#sidebar { width: 230px; background: #1e3a5f; color: #e5e7eb; flex-shrink: 0; display: flex; flex-direction: column; }
#sidebar .sbbrand { display: flex; align-items: center; gap: 10px; padding: 14px 14px 6px; }
#sidebar .sbbrand img { width: 42px; height: auto; flex-shrink: 0; }
#sidebar h1 { font-size: 15px; color: #fff; line-height: 1.35; }
#sidebar .sub { font-size: 11.5px; color: #9db4cc; padding: 0 14px 12px; border-bottom: 1px solid #2d4d75; }
#sidebar nav { flex: 1; overflow-y: auto; padding: 8px 0; }
#sidebar nav button { display: block; width: 100%; text-align: left; background: none; border: none; color: #cfdbe8; padding: 9px 16px; font-size: 13.5px; cursor: pointer; border-left: 3px solid transparent; }
#sidebar nav button:hover { background: #2d4d75; color: #fff; }
#sidebar nav button.active { background: #2d4d75; color: #fff; border-left-color: #f59e0b; font-weight: 600; }
#sidebar nav .grp { font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: #7f97b2; padding: 12px 16px 4px; }
#sidebar .foot { font-size: 11px; color: #7f97b2; padding: 10px 14px; border-top: 1px solid #2d4d75; }

/* ===== Main ===== */
#main { flex: 1; padding: 20px 24px; max-width: 1200px; }
.module { display: none; }
.module.active { display: block; }
h2.mtitle { font-size: 19px; color: #1e3a5f; margin-bottom: 14px; }
.card { background: #fff; border: 1px solid #d1d5db; border-radius: 6px; padding: 16px; margin-bottom: 16px; }
.card h3 { font-size: 15px; color: #1e3a5f; margin-bottom: 12px; padding-bottom: 8px; border-bottom: 1px solid #e5e7eb; }

/* ===== Forms ===== */
.frm { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px 14px; }
.frm .fw { grid-column: 1 / -1; }
.frm .half { grid-column: span 2; }
.fld label { display: block; font-size: 12px; font-weight: 600; color: #4b5563; margin-bottom: 3px; }
.fld input[type=text], .fld input[type=date], .fld input[type=number], .fld select, .fld textarea {
  width: 100%; padding: 6px 8px; border: 1px solid #cbd5e1; border-radius: 4px; font-size: 13.5px; font-family: inherit; background: #fff; }
.fld textarea { resize: vertical; min-height: 54px; }
.fld input:focus, .fld select:focus, .fld textarea:focus { outline: 2px solid #93c5fd; border-color: #3b82f6; }
.fld input[readonly] { background: #f9fafb; color: #6b7280; }
.hint { font-size: 11.5px; color: #6b7280; margin-top: 2px; }
.chkline { display: flex; align-items: center; gap: 6px; font-size: 13px; }

/* ===== Buttons ===== */
button.btn { padding: 7px 16px; border: 1px solid #1e3a5f; background: #1e3a5f; color: #fff; border-radius: 4px; font-size: 13.5px; cursor: pointer; }
button.btn:hover { background: #2d4d75; }
button.btn.sec { background: #fff; color: #1e3a5f; }
button.btn.sec:hover { background: #eff6ff; }
button.btn.warn { background: #fff; color: #b91c1c; border-color: #b91c1c; }
button.btn.warn:hover { background: #fef2f2; }
button.mini { padding: 3px 8px; font-size: 12px; border: 1px solid #94a3b8; background: #fff; color: #334155; border-radius: 3px; cursor: pointer; margin: 1px 2px 1px 0; white-space: nowrap; }
button.mini:hover { background: #e0e7ef; }
button.mini.del { color: #b91c1c; border-color: #dca5a5; }
button.mini.del:hover { background: #fef2f2; }
.btnrow { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; align-items: center; }

/* ===== Tables ===== */
table.tbl { width: 100%; border-collapse: collapse; font-size: 13px; background: #fff; }
table.tbl th, table.tbl td { border: 1px solid #d1d5db; padding: 5px 7px; text-align: left; vertical-align: top; }
table.tbl th { background: #eef2f7; color: #1e3a5f; font-size: 12px; white-space: nowrap; }
table.tbl th.sortable { cursor: pointer; user-select: none; }
table.tbl th.sortable:hover { background: #dbe4ef; }
table.tbl th.sorted { background: #d3deeb; }
table.tbl td.num, table.tbl th.num { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
table.tbl tr.sum td { font-weight: 700; background: #f8fafc; }
table.tbl td input, table.tbl td select { width: 100%; border: 1px solid transparent; background: transparent; padding: 3px 4px; font-size: 13px; font-family: inherit; }
table.tbl td input:hover { border-color: #cbd5e1; }
table.tbl td input:focus { border-color: #3b82f6; background: #fff; outline: none; }
table.tbl td input.num { text-align: right; }
.tblwrap { overflow-x: auto; }
/* Cột diễn giải / nội dung: hiển thị ĐẦY ĐỦ, tự xuống dòng thay vì cắt bớt bằng "…" */
table.tbl td.wrap { min-width: 240px; max-width: 520px; white-space: normal; word-break: break-word; line-height: 1.45; }
.searchrow { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; align-items: center; }
.searchrow input, .searchrow select { padding: 6px 8px; border: 1px solid #cbd5e1; border-radius: 4px; font-size: 13px; }
.searchrow input[type=text] { min-width: 240px; }

/* ===== Dashboard cards ===== */
.cards { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 16px; }
.scard { background: #fff; border: 1px solid #d1d5db; border-left: 4px solid #1e3a5f; border-radius: 6px; padding: 14px; }
.scard .lbl { font-size: 12px; color: #6b7280; margin-bottom: 4px; }
.scard .val { font-size: 20px; font-weight: 700; color: #1e3a5f; font-variant-numeric: tabular-nums; }
.scard.green { border-left-color: #15803d; } .scard.green .val { color: #15803d; }
.scard.red { border-left-color: #b91c1c; } .scard.red .val { color: #b91c1c; }
.scard.amber { border-left-color: #b45309; } .scard.amber .val { color: #b45309; }

/* ===== Misc ===== */
.badge { display: inline-block; padding: 1px 7px; border-radius: 9px; font-size: 11px; font-weight: 600; }
.badge.pt { background: #dcfce7; color: #15803d; }
.badge.pc { background: #fee2e2; color: #b91c1c; }
.badge.pu { background: #fef3c7; color: #b45309; }
.badge.hu { background: #dbeafe; color: #1d4ed8; }
.badge.tm { background: #f3e8ff; color: #7e22ce; }
.badge.ck { background: #e0f2fe; color: #0369a1; }
.attlist { font-size: 12px; margin-top: 4px; }
.attlist .att { display: inline-flex; align-items: center; gap: 4px; background: #eef2f7; border: 1px solid #d1d5db; border-radius: 4px; padding: 2px 7px; margin: 2px 4px 2px 0; }
.attlist img.thumb { height: 34px; border-radius: 3px; vertical-align: middle; cursor: pointer; }
.attlist .rm { color: #b91c1c; cursor: pointer; font-weight: 700; padding: 0 2px; }
.msg { padding: 9px 12px; border-radius: 4px; font-size: 13px; margin: 8px 0; display: none; }
.msg.ok { display: block; background: #dcfce7; color: #14532d; border: 1px solid #86efac; }
.msg.err { display: block; background: #fee2e2; color: #7f1d1d; border: 1px solid #fca5a5; }
.note { font-size: 12.5px; color: #6b7280; line-height: 1.5; }
.warnbox { background: #fef2f2; border: 1px solid #fca5a5; color: #7f1d1d; border-radius: 4px; padding: 8px 10px; font-size: 12.5px; margin-top: 6px; line-height: 1.5; }
.okbox { background: #f0fdf4; border: 1px solid #86efac; color: #14532d; border-radius: 4px; padding: 8px 10px; font-size: 12.5px; margin-top: 6px; line-height: 1.5; }
td.over { color: #b91c1c; font-weight: 700; }
/* trạng thái đồng bộ Supabase */
.sbpill { display: inline-block; margin-bottom: 6px; padding: 3px 8px; border-radius: 10px; font-size: 11px; font-weight: 600; line-height: 1.5; }
.sbpill.off { background: #33465f; color: #9db4cc; }
.sbpill.live { background: #14532d; color: #86efac; }
.sbpill.wait { background: #5a4408; color: #fcd34d; }
.sbpill.err { background: #5f1f1f; color: #fca5a5; }
#sbToast { position: fixed; right: 18px; bottom: 18px; z-index: 70; background: #1e3a5f; color: #fff; padding: 10px 16px; border-radius: 6px; font-size: 13px; box-shadow: 0 4px 14px rgba(15,23,42,.28); opacity: 0; transform: translateY(8px); transition: opacity .2s, transform .2s; pointer-events: none; max-width: 340px; }
#sbToast.show { opacity: 1; transform: translateY(0); }
hr.sep { border: none; border-top: 1px dashed #cbd5e1; margin: 14px 0; }

/* ===== Modal ===== */
#modalBack { display: none; position: fixed; inset: 0; background: rgba(15,23,42,.45); z-index: 50; align-items: center; justify-content: center; }
#modalBack.show { display: flex; }
#modalBox { background: #fff; border-radius: 8px; padding: 20px; max-width: 460px; width: 92%; }
#modalBox h3 { font-size: 15px; color: #1e3a5f; margin-bottom: 8px; }
#modalBox p { font-size: 13px; color: #4b5563; margin-bottom: 14px; line-height: 1.5; }
#imgView { display: none; position: fixed; inset: 0; background: rgba(15,23,42,.8); z-index: 60; align-items: center; justify-content: center; cursor: zoom-out; }
#imgView.show { display: flex; }
#imgView img { max-width: 92%; max-height: 92%; background: #fff; }

/* ===== PRINT ===== */
#printArea { display: none; }
@media print {
  body * { visibility: hidden; }
  #printArea, #printArea * { visibility: visible; }
  #printArea { display: block !important; position: absolute; top: 0; left: 0; width: 100%; }
  #sidebar, #main { display: none; }
}
/* print document styles */
.pdoc { font-family: "Times New Roman", Times, serif; font-size: 13px; color: #000; width: 100%; }
.pdoc .phead { display: flex; justify-content: space-between; align-items: flex-start; }
.pdoc .porgwrap { display: flex; align-items: center; gap: 10px; }
.pdoc .plogo { width: 58px; height: auto; flex-shrink: 0; }   /* giữ đúng tỉ lệ huy hiệu, không bị bóp méo */
.pdoc .porg { font-size: 12px; font-weight: 700; line-height: 1.45; }
.pdoc .porg .u { text-decoration: underline; }
.pdoc .pmau { font-size: 10.5px; font-style: italic; text-align: center; max-width: 230px; border: 1px solid #000; padding: 3px 6px; }
.pdoc h1.ptitle { text-align: center; font-size: 19px; margin: 12px 0 2px; letter-spacing: .5px; }
.pdoc .pnumline { text-align: right; font-size: 13px; margin: 4px 0 8px; line-height: 1.6; }
.pdoc .pinfo { margin: 3px 0; }
.pdoc table.ptbl { width: 100%; border-collapse: collapse; margin: 8px 0; }
.pdoc table.ptbl th, .pdoc table.ptbl td { border: 1px solid #000; padding: 5px 6px; font-size: 13px; vertical-align: top; }
.pdoc table.ptbl th { text-align: center; font-weight: 700; }
.pdoc table.ptbl td.num { text-align: right; white-space: nowrap; }
.pdoc .psig { display: flex; justify-content: space-between; text-align: center; margin-top: 16px; }
.pdoc .psig > div { flex: 1; }
.pdoc .psig .role { font-weight: 700; font-size: 13px; }
.pdoc .psig .name { margin-top: 58px; font-weight: 700; }
.pdoc .psig .fn { font-size: 12px; font-style: italic; }
.pdoc .pfoot { font-size: 11px; font-style: italic; margin-top: 14px; }
.pdoc tr.sum td { font-weight: 700; }
.pdoc .center { text-align: center; }
.pdoc .b { font-weight: 700; }
.pdoc .i { font-style: italic; }
.pdoc .pattach { page-break-before: always; text-align: center; }
.pdoc .pattach img { max-width: 100%; max-height: 180mm; }

/* ===== MẪU ỦY NHIỆM CHI NGÂN HÀNG OCB — QLCLDV_MB03_26 (1 đơn vị hưởng) =====
   Mỗi liên in riêng MỘT trang (Liên 1 Ngân hàng giữ · Liên 2 Khách hàng giữ).
   Khổ gốc file Word là 21 x 14,8 cm; nới cao thêm 1 cm để ô ký tên rộng rãi hơn. */
.ocb { width: 198mm; height: 152mm; box-sizing: border-box; padding: 1.5mm 3mm 0;
  font-family: Calibri, "Segoe UI", Arial, Helvetica, sans-serif; color: #000;
  font-size: 8.5pt; line-height: 1.15; display: flex; flex-direction: column; overflow: hidden; }
.ocb + .ocb { page-break-before: always; }   /* mỗi liên một trang */
.ocb .i, .ocb i { font-style: italic; }
.ocb .ohead { display: flex; align-items: flex-start; margin-bottom: 1.2mm; }
.ocb .ohead img { width: 66mm; height: auto; display: block; flex: none; }
.ocb .ohright { flex: 1; text-align: right; }
.ocb .otitle { padding-top: 1mm; }
.ocb .otitle b { font-size: 18.4pt; letter-spacing: .5px; }          /* 11,5pt +60% */
.ocb .otitle span { display: block; font-style: italic; font-weight: 700; font-size: 13.6pt; }  /* 8,5pt +60% */
.ocb .otrans { font-size: 8.5pt; padding-top: 1.2mm; white-space: nowrap; }  /* bằng cỡ dòng "Tên tài khoản" */
.ocb .obox { border: .5pt solid #70AD47; display: flex; flex-direction: column; flex: 1; }
.ocb .obar { background: #007E39; color: #fff; font-weight: 700; padding: .9mm 1.2mm .7mm;
  border-bottom: .5pt solid #70AD47; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
.ocb .or { display: flex; align-items: flex-end; padding: .7mm 1.2mm; border-bottom: .5pt solid #70AD47; min-height: 4.1mm; }
.ocb .ol { white-space: nowrap; flex: none; }
.ocb .ov { flex: 1; min-width: 6mm; border-bottom: 1px dotted #64748b; font-weight: 700;
  padding: 0 1.2mm .2mm; margin: 0 1mm; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
/* giá trị dài thì tự thu nhỏ chữ thay vì bị cắt mất */
.ocb .ov.sm, .ocb .ond.sm { font-size: 7.5pt; }
.ocb .ov.xs, .ocb .ond.xs { font-size: 6.5pt; }
.ocb .osig { min-height: 31mm; }   /* chỗ ký tên — đã nới thêm 1 cm */
.ocb .ochk { display: inline-block; width: 2.6mm; height: 2.6mm; border: .6pt solid #000; text-align: center;
  line-height: 2.4mm; font-size: 6.5pt; font-weight: 700; margin-right: 1mm; }
.ocb .osec2 { display: flex; border-bottom: .5pt solid #70AD47; }
.ocb .osec2 > div { display: flex; flex-direction: column; }
.ocb .osec2 .c1 { flex: 0 0 61.8%; border-right: .5pt solid #70AD47; }
.ocb .osec2 .c2 { flex: 1; }
.ocb .osec2 .obar { border-bottom: .5pt solid #70AD47; }
.ocb .ond { padding: 1.2mm; min-height: 9.5mm; font-weight: 700; white-space: pre-wrap; word-break: break-word; }
.ocb .ofee { padding: 1mm 1.2mm; }
.ocb .ofee div { padding: .4mm 0; }
.ocb .osig { display: flex; flex: 1; }
.ocb .osig > .sL { flex: 0 0 58.5%; border-right: .5pt solid #70AD47; display: flex; flex-direction: column; }
.ocb .osig > .sR { flex: 1; display: flex; flex-direction: column; }
.ocb .ocols { display: flex; flex: 1; }
.ocb .ocols > div { display: flex; flex-direction: column; border-right: .5pt solid #70AD47; }
.ocb .ocols > div:last-child { border-right: none; }
.ocb .osrole { text-align: center; font-weight: 700; padding: .8mm 1mm 0; }
.ocb .osnote { text-align: center; font-style: italic; font-size: 6.5pt; padding: 0 1mm; }
/* Không in sẵn tên người ký — để trống cho ký tay */
.ocb .ofoot { background: #008A3E; color: #fff; font-weight: 700; font-size: 7pt; padding: 1mm 2mm;
  display: flex; align-items: center; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
.ocb .ofoot .fsp { flex: 1; }
.ocb .ofoot svg { width: 3mm; height: 3mm; fill: #fff; margin-right: 1mm; vertical-align: -.4mm; }
/* Dòng mã số + Liên: nằm NGAY TRÊN thanh footer xanh */
.ocb .obot { display: flex; justify-content: space-between; font-style: italic; font-size: 6.5pt; padding: .8mm 0 .6mm; }
.ocb .obot .bl { text-align: left; }        /* mã số QLCLDV — lề trái */
.ocb .obot .br { text-align: right; }       /* Liên 1 / Liên 2 — lề phải */
</style>
<style id="pageRule">@page { size: A4 portrait; margin: 12mm; }</style>
</head>
<body>
<div id="app">
  <aside id="sidebar">
    <div class="sbbrand"><img id="sbLogo" alt="Công đoàn Việt Nam">
      <h1>QUẢN LÝ THU – CHI<br>TÀI CHÍNH CÔNG ĐOÀN</h1></div>
    <div class="sub">CĐCS Công ty TNHH LDKS Plaza<br>(Sofitel Saigon Plaza)</div>
    <nav id="nav"></nav>
    <div class="foot"><span class="sbpill off" id="sbPill" onclick="goMod('caidat')" style="cursor:pointer">○ Đồng bộ: TẮT</span><br>Dữ liệu lưu trên trình duyệt.<br>Nhớ Xuất dữ liệu để sao lưu định kỳ.</div>
  </aside>
  <main id="main">
    <div class="module" id="mod-dashboard"></div>
    <div class="module" id="mod-pt"></div>
    <div class="module" id="mod-pc"></div>
    <div class="module" id="mod-tu"></div>
    <div class="module" id="mod-unc"></div>
    <div class="module" id="mod-soquy"></div>
    <div class="module" id="mod-sonh"></div>
    <div class="module" id="mod-baocao"></div>
    <div class="module" id="mod-kpdp"></div>
    <div class="module" id="mod-thamvieng"></div>
    <div class="module" id="mod-phucap"></div>
    <div class="module" id="mod-caidat"></div>
  </main>
</div>
<div id="modalBack"><div id="modalBox"></div></div>
<div id="imgView" onclick="this.classList.remove('show')"><img id="imgViewImg" alt=""></div>
<div id="printArea"></div>
<script>
'use strict';
/* ================================================================
   DANH MỤC MỤC & MÃ SỐ — sửa tại đây nếu có thay đổi
   ================================================================ */
const DM_THU = [
  { ma: '22', ten: 'Thu kinh phí Công đoàn' },
  { ma: '23', ten: 'Thu đoàn phí công đoàn' },
  { ma: '24', ten: 'Các khoản thu khác' },
  { ma: '25', ten: 'Kinh phí cấp trên cấp' },
  { ma: '26', ten: 'Số dư kỳ trước chuyển sang (Tiền mặt / TK ngân hàng)' }
];
const DM_CHI = [
  { ma: '27', ten: 'Lương, phụ cấp và các khoản phải nộp' },
  { ma: '28', ten: 'Phụ cấp cán bộ không chuyên trách' },
  { ma: '29', ten: 'Quản lý hành chánh' },
  { ma: '31', ten: 'Hoạt động phong trào' },
  { ma: '33', ten: 'Thăm hỏi đoàn viên' },
  { ma: '35', ten: 'Các khoản chi khác' },
  { ma: '36', ten: 'Kinh phí nộp cấp trên trực tiếp' },
  { ma: '37', ten: 'Đoàn phí nộp cấp trên trực tiếp' },
  { ma: '49', ten: 'Kinh phí phải nộp cấp trên trong kỳ (29%)' }
];
/* Hạn mức chi thăm hỏi cho mỗi đoàn viên trong 1 năm (đồng) */
const HAN_MUC_TH = 3000000;
const TH_LOAI = [
  { k: 'thamBenh', ten: 'Thăm bệnh' },
  { k: 'thamVieng', ten: 'Thăm viếng' },
  { k: 'mungCuoi', ten: 'Mừng cưới' },

      capTren: 'CÔNG ĐOÀN TỔNG CÔNG TY BẾN THÀNH',
      donVi: 'CÔNG ĐOÀN CƠ SỞ CÔNG TY TNHH LDKS PLAZA',
      diaChi: '17 Lê Duẩn, Quận 1, TP. Hồ Chí Minh',
      keToan: 'Huỳnh Thị Trúc Dịu',
      chuTich: 'Nguyễn Trung Khánh',
      thuQuy: 'Lưu Thị Khánh Vân',
      nhTen: 'Công đoàn cơ sở Công ty TNHH Liên doanh Khách sạn Plaza',
      nhSTK: '', nhNganHang: '',
      nhChiNhanh: '', nhDiaChi: '',   // chi nhánh & địa chỉ bên trả tiền — in trên Ủy nhiệm chi ngân hàng
      nguoiNhan: {},   // danh bạ người thụ hưởng: { khóa tên: {ten, stk, nh, tinh, diaChi} }
      soDu: {},        // { '2026': { TM: 0, NH: 0 } }
      chiTieu: {},     // { '2026': { laoDong, doanVien, chuyenTrach, quyLuong } }
      // Cấu hình Supabase — chỉ lưu trên máy này, KHÔNG đồng bộ lên mây
      sb: { enabled: false, url: '', key: '', lastPush: '', lastPull: '' }
    },
    phieu: [],   // {id, loai, so, ngay, nguoi, diaChi, lyDo, dienGiai, soTien, bangChu, maSo, taiKhoan, hinhThuc, no, co, puRef, files[], createdAt}
    unc: [],     // {id, so, ngay, traTen, traSTK, traNH, nhanTen, nhanSTK, nhanNH, soTien, bangChu, noiDung, pcRef, files[], createdAt}
    kpdp: {},    // { '2026': [ {ten, vals:[12 số]} ] }
    thamVieng: [], // {hoTen, boPhan, thamBenh, thamVieng, ghiChu}
    phuCap: {}   // { '2026-1': [ {hoTen, chucVu, soTien, ghiChu} ] }
  };
}
let DB = null;
function loadDB() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (raw) { DB = JSON.parse(raw); }
  } catch (e) { console.error(e); }
  if (!DB || typeof DB !== 'object') DB = defaultDB();
  // đảm bảo đủ nhánh khi nâng cấp phiên bản
  const d = defaultDB();
  for (const k in d) if (DB[k] === undefined) DB[k] = d[k];
  for (const k in d.settings) if (DB.settings[k] === undefined) DB.settings[k] = d.settings[k];
  migrateData();
}
function migrateData() {
  // bổ sung trường mới cho dữ liệu cũ
  (DB.thamVieng || []).forEach(r => {
    if (r.mungCuoi === undefined) r.mungCuoi = 0;
    if (r.thaiSan === undefined) r.thaiSan = 0;
    if (!r.nam) {
      const m = /(\d{1,2})\/(\d{1,2})\/(\d{4})/.exec(r.ghiChu || '');
      r.nam = m ? Number(m[3]) : new Date().getFullYear();
    }
    if (!r.id) r.id = uid();          // cần mã riêng để đồng bộ từng dòng
  });
  (DB.phieu || []).forEach(p => { if (p.boPhan === undefined) p.boPhan = ''; });
  // bổ sung các trường của mẫu Ủy nhiệm chi ngân hàng OCB cho dữ liệu cũ
  (DB.unc || []).forEach(u => {
    ['traChiNhanh', 'traDiaChi', 'nhanTinh', 'nhanDiaChi', 'nhanGTTT', 'nhanGTTTNgay', 'nhanGTTTNoi', 'maGD']
      .forEach(f => { if (u[f] === undefined) u[f] = ''; });
    if (!u.nhanLoai) u.nhanLoai = 'STK';
    if (!u.phiBen) u.phiBen = 'TT';
  });
  if (DB.settings && DB.settings.cloud) delete DB.settings.cloud;   // bỏ cấu hình Firebase cũ
}
function saveDB() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(DB)); }
  catch (e) { alert('KHÔNG LƯU ĐƯỢC DỮ LIỆU!\nDung lượng lưu trữ trình duyệt có thể đã đầy (thường do file đính kèm quá lớn).\nHãy xóa bớt file đính kèm hoặc Xuất dữ liệu để sao lưu.\n\nChi tiết: ' + e.message); }
  try { sbAfterSave(); } catch (e) { console.warn('Đồng bộ:', e); }
}

/* ================================================================
   TIỆN ÍCH
   ================================================================ */
function $(id) { return document.getElementById(id); }
function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
function fmt(n) { n = Number(n) || 0; return n.toLocaleString('vi-VN'); }
function parseMoney(s) { return Number(String(s == null ? '' : s).replace(/[^\d-]/g, '')) || 0; }
function todayISO() { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function fmtDate(iso) { if (!iso) return ''; const p = iso.split('-'); return p.length === 3 ? p[2] + '/' + p[1] + '/' + p[0] : iso; }
function yearOf(iso) { return Number((iso || '').slice(0, 4)) || 0; }
function monthOf(iso) { return Number((iso || '').slice(5, 7)) || 0; }
function quarterOf(iso) { return Math.ceil(monthOf(iso) / 3) || 0; }
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }
function moneyInput(el) {
  el.addEventListener('input', function () {
    const v = parseMoney(el.value);
    el.value = v ? fmt(v) : '';
    if (el.dataset.words) { const w = $(el.dataset.words); if (w) w.value = soThanhChu(v); }
  });
}
function dmOptions(dm, sel) {
  const list = dm === 'THU' ? DM_THU : dm === 'CHI' ? DM_CHI : DM_THU.concat(DM_CHI);
  let h = '<option value="">— Chọn mục / mã số —</option>';
  for (const it of list) h += '<option value="' + it.ma + '"' + (sel === it.ma ? ' selected' : '') + '>' + it.ma + ' — ' + esc(it.ten) + '</option>';
  return h;
}
function tenMuc(ma) { const it = DM_THU.concat(DM_CHI).find(x => x.ma === ma); return it ? it.ten : ''; }

/* ---------- Hạn mức thăm hỏi đoàn viên ---------- */
function normName(s) { return String(s || '').trim().toLowerCase().replace(/\s+/g, ' '); }
function tongThamHoiRow(r) { return (Number(r.thamBenh) || 0) + (Number(r.thamVieng) || 0) + (Number(r.mungCuoi) || 0) + (Number(r.thaiSan) || 0); }
function tongThamHoi(hoTen, nam) {
  const n = normName(hoTen);
  if (!n) return 0;
  return DB.thamVieng.filter(r => normName(r.hoTen) === n && Number(r.nam) === Number(nam)).reduce((s, r) => s + tongThamHoiRow(r), 0);
}
function thamHoiStats(nam) {
  // gộp theo tên (không phân biệt hoa thường) trong 1 năm
  const map = {};
  DB.thamVieng.forEach(r => {
    if (Number(r.nam) !== Number(nam)) return;
    const n = normName(r.hoTen);
    if (!n) return;
    if (!map[n]) map[n] = { hoTen: r.hoTen, boPhan: r.boPhan || '', thamBenh: 0, thamVieng: 0, mungCuoi: 0, thaiSan: 0, tong: 0 };
    TH_LOAI.forEach(t => { map[n][t.k] += Number(r[t.k]) || 0; });
    map[n].tong += tongThamHoiRow(r);
    if (!map[n].boPhan && r.boPhan) map[n].boPhan = r.boPhan;
  });
  return Object.values(map).sort((a, b) => b.tong - a.tong);
}

/* ---------- Đọc số thành chữ tiếng Việt ---------- */
const CHU_SO = ['không', 'một', 'hai', 'ba', 'bốn', 'năm', 'sáu', 'bảy', 'tám', 'chín'];
function doc3(n, full) {
  const t = Math.floor(n / 100), c = Math.floor((n % 100) / 10), d = n % 10, p = [];
  if (t > 0 || full) { p.push(CHU_SO[t], 'trăm'); }
  if (c > 1) {
    p.push(CHU_SO[c], 'mươi');
    if (d === 1) p.push('mốt'); else if (d === 4) p.push('tư'); else if (d === 5) p.push('lăm'); else if (d > 0) p.push(CHU_SO[d]);
  } else if (c === 1) {
    p.push('mười');
    if (d === 5) p.push('lăm'); else if (d > 0) p.push(CHU_SO[d]);
  } else if (d > 0) {
    if (t > 0 || full) p.push('linh');
    p.push(CHU_SO[d]);
  }
  return p.join(' ');
}
function soThanhChu(n) {
  n = Math.floor(Math.abs(Number(n) || 0));
  if (n === 0) return '';
  const donVi = ['', ' nghìn', ' triệu', ' tỷ', ' nghìn tỷ', ' triệu tỷ'];
  const groups = [];
  while (n > 0) { groups.push(n % 1000); n = Math.floor(n / 1000); }
  let s = '', started = false;
  for (let i = groups.length - 1; i >= 0; i--) {
    const g = groups[i];
    if (g > 0) {
      s += (s ? ' ' : '') + doc3(g, started && g < 100) + donVi[i];
      started = true;
    }
  }
  s = s.trim();
  s = s.charAt(0).toUpperCase() + s.slice(1) + ' đồng chẵn./.';
  return s;
}

/* ---------- Đính kèm file ---------- */
function handleFiles(input, arr, listElId) {
  const files = Array.from(input.files || []);
  input.value = '';
  let pending = files.length;
  if (!pending) return;
  files.forEach(f => {
    if (f.type.indexOf('image/') === 0) {
      const img = new Image();
      const url = URL.createObjectURL(f);
      img.onload = function () {
        const MAX = 1400;
        let w = img.width, h = img.height;
        if (w > MAX || h > MAX) { const r = Math.min(MAX / w, MAX / h); w = Math.round(w * r); h = Math.round(h * r); }
        const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
        cv.getContext('2d').drawImage(img, 0, 0, w, h);
        arr.push({ name: f.name, type: 'image/jpeg', data: cv.toDataURL('image/jpeg', 0.78) });
        URL.revokeObjectURL(url);
        if (--pending === 0) renderAttList(arr, listElId);
      };
      img.onerror = function () { URL.revokeObjectURL(url); if (--pending === 0) renderAttList(arr, listElId); };
      img.src = url;
    } else {
      if (f.size > 800 * 1024 && !confirm('File "' + f.name + '" khá lớn (' + Math.round(f.size / 1024) + ' KB). Lưu file lớn có thể làm đầy bộ nhớ trình duyệt. Vẫn đính kèm?')) {
        if (--pending === 0) renderAttList(arr, listElId);
        return;
      }
      const rd = new FileReader();
      rd.onload = function () { arr.push({ name: f.name, type: f.type || 'application/octet-stream', data: rd.result }); if (--pending === 0) renderAttList(arr, listElId); };
      rd.readAsDataURL(f);
    }
  });
}
function renderAttList(arr, elId) {
  const el = $(elId); if (!el) return;
  el.innerHTML = arr.map((f, i) =>
    '<span class="att">' +
    (f.type.indexOf('image/') === 0 ? '<img class="thumb" src="' + f.data + '" onclick="viewImg(this.src)" alt="">' : '📄') +
    ' ' + esc(f.name) +
    ' <a href="' + f.data + '" download="' + esc(f.name) + '" title="Tải về">⬇</a>' +
    ' <span class="rm" title="Gỡ" onclick="rmAtt(\'' + elId + '\',' + i + ')">✕</span></span>'
  ).join('') || '<span class="note">Chưa có file đính kèm.</span>';
}
const ATT_BUF = {}; // buffer đính kèm cho từng form
function rmAtt(elId, i) { const arr = ATT_BUF[elId]; if (arr) { arr.splice(i, 1); renderAttList(arr, elId); } }
function viewImg(src) { $('imgViewImg').src = src; $('imgView').classList.add('show'); }

/* ---------- Số phiếu tự sinh ---------- */
function nextSo(loai, nam) {
  nam = nam || new Date().getFullYear();
  const re = new RegExp('^' + loai + '\\s*(\\d+)\\s*/\\s*' + nam + '$', 'i');
  let max = 0;
  const list = loai === 'UNC' ? DB.unc : DB.phieu.filter(p => p.loai === loai);
  list.forEach(p => { const m = re.exec((p.so || '').trim()); if (m) max = Math.max(max, Number(m[1])); });
  return loai + ' ' + String(max + 1).padStart(2, '0') + '/' + nam;
}

    if (tenTH) {
      const daChi = tongThamHoi(tenTH, yearOf(ngay));
      if (daChi + soTien > HAN_MUC_TH) {
        if (!confirm('CẢNH BÁO VƯỢT HẠN MỨC THĂM HỎI!\n\nĐoàn viên: ' + tenTH + '\nĐã chi trong năm ' + yearOf(ngay) + ': ' + fmt(daChi) + ' đ\nPhiếu này: ' + fmt(soTien) + ' đ\nTổng sau phiếu: ' + fmt(daChi + soTien) + ' đ\n\nVƯỢT hạn mức ' + fmt(HAN_MUC_TH) + ' đ/đoàn viên/năm.\n\nBấm OK để VẪN LƯU phiếu, Cancel để hủy.')) return;
      }
    }
  }
  const p = {
    id: editingPhieu[loai] || uid(),
    loai: loai,
    so: g('so').value.trim(),
    ngay: ngay,
    nguoi: g('nguoi').value.trim(),
    boPhan: g('bophan').value.trim(),
    diaChi: g('diachi').value.trim(),
    dienGiai: g('diengiai').value.trim(),
    soTien: soTien,
    bangChu: g('bangchu').value.trim() || soThanhChu(soTien),
    maSo: g('maso').value,
    taiKhoan: g('taikhoan').value.trim() || 'Công đoàn',
    hinhThuc: g('hinhthuc').value,
    no: g('no').value.trim(),
    co: g('co').value.trim(),
    puRef: loai === 'HU' ? $('f_HU_puRef').value : '',
    files: ATT_BUF['att_' + loai].slice(),
    createdAt: new Date().toISOString()
  };
  const idx = DB.phieu.findIndex(x => x.id === p.id);
  if (idx >= 0) { p.createdAt = DB.phieu[idx].createdAt; DB.phieu[idx] = p; }
  else {
    if (DB.phieu.some(x => x.loai === loai && x.so === p.so)) p.so = nextSo(loai, yearOf(ngay) || undefined);
    DB.phieu.push(p);
  }
  // Phiếu chi mã 33 → thêm vào danh sách thăm viếng
  if (loai === 'PC' && p.maSo === '33' && $('pc33chk').checked && idx < 0) {
    const lv = $('pc33loai').value;
    const row = {
      id: uid(),
      hoTen: $('pc33ten').value.trim() || p.nguoi,
      boPhan: $('pc33bophan').value.trim() || p.boPhan,
      nam: yearOf(p.ngay),
      thamBenh: 0, thamVieng: 0, mungCuoi: 0, thaiSan: 0,
      ghiChu: p.so + ' — ' + fmtDate(p.ngay)
    };
    row[lv] = p.soTien;
    DB.thamVieng.push(row);
  }
  // Phiếu chi chuyển khoản → lập ngay Ủy nhiệm chi ngân hàng theo mẫu OCB
  let uncMoi = null;
  if (loai === 'PC' && p.hinhThuc === 'CK') {
    const ck = pcckRead();
    if (ck && (ck.auto || inUNCNgay)) {
      const cu = DB.unc.find(x => x.pcRef === p.id);
      uncMoi = uncTuPhieuChi(p, ck, cu);
      nnSave({ ten: uncMoi.nhanTen, stk: uncMoi.nhanSTK, nh: uncMoi.nhanNH, tinh: uncMoi.nhanTinh, diaChi: uncMoi.nhanDiaChi });
      if (cu) DB.unc[DB.unc.indexOf(cu)] = uncMoi; else DB.unc.push(uncMoi);
    }
  }
  saveDB();
  resetPhieuForm(loai);
  renderAll();
  const m = $('fmsg_' + loai);
  m.innerHTML = '<span style="color:#15803d;font-weight:600">Đã lưu ' + esc(p.so) + ' ✓</span> ' +
    '<button class="mini" onclick="printPhieu(\'' + p.id + '\')">🖨 In phiếu vừa lưu</button>' +
    (uncMoi ? ' <span style="color:#15803d">· đã lập <b>' + esc(uncMoi.so) + '</b></span>' +
      ' <button class="mini" onclick="printUNC(\'' + uncMoi.id + '\')">🖨 In Ủy nhiệm chi (mẫu OCB)</button>' +
      ' <button class="mini" onclick="editUNC(\'' + uncMoi.id + '\')">✎ Sửa UNC</button>'
      : (loai === 'PC' && p.hinhThuc === 'CK' ? ' <button class="mini" onclick="taoUNCTuPC(\'' + p.id + '\')">➜ Tạo Ủy nhiệm chi</button>' : ''));
  if (uncMoi && inUNCNgay) printUNC(uncMoi.id);
  setTimeout(() => { if (m) m.innerHTML = ''; }, 20000);
}
/* Dựng bản ghi Ủy nhiệm chi từ một Phiếu Chi chuyển khoản */
function uncTuPhieuChi(p, ck, cu) {
  const s = DB.settings;
  ck = ck || {};
  return {
    id: (cu && cu.id) || uid(),
    so: (cu && cu.so) || nextSo('UNC', yearOf(p.ngay) || undefined),
    ngay: p.ngay,
    maGD: (cu && cu.maGD) || '',
    traTen: s.nhTen, traSTK: s.nhSTK, traNH: s.nhNganHang,
    traChiNhanh: s.nhChiNhanh || '', traDiaChi: s.nhDiaChi || s.diaChi || '',
    nhanTen: ck.ten || p.nguoi, nhanSTK: ck.stk || '', nhanNH: ck.nh || '',
    nhanTinh: ck.tinh || '', nhanDiaChi: ck.diaChi || '',
    nhanLoai: 'STK', nhanGTTT: '', nhanGTTTNgay: '', nhanGTTTNoi: '',
    soTien: p.soTien,
    bangChu: p.bangChu || soThanhChu(p.soTien),
    noiDung: p.dienGiai,
    phiBen: ck.phi || 'TT',
    pcRef: p.id,
    files: (cu && cu.files) || [],
    createdAt: (cu && cu.createdAt) || new Date().toISOString()
  };
}
function editPhieu(id) {
  const p = DB.phieu.find(x => x.id === id); if (!p) return;
  const loai = p.loai;
  goMod(loai === 'PT' ? 'pt' : loai === 'PC' ? 'pc' : 'tu');
  if (loai === 'PU' || loai === 'HU') switchTU(loai);
  editingPhieu[loai] = id;
  $('fh_' + loai).textContent = 'Sửa ' + LOAI_INFO[loai].ten + ' ' + p.so;
  $('f_' + loai + '_so').value = p.so;
  $('f_' + loai + '_ngay').value = p.ngay;
  $('f_' + loai + '_nguoi').value = p.nguoi;
  $('f_' + loai + '_bophan').value = p.boPhan || '';
  $('f_' + loai + '_diachi').value = p.diaChi;
  $('f_' + loai + '_diengiai').value = p.dienGiai;
  $('f_' + loai + '_sotien').value = fmt(p.soTien);
  $('f_' + loai + '_bangchu').value = p.bangChu;
  $('f_' + loai + '_maso').value = p.maSo;
  $('f_' + loai + '_taikhoan').value = p.taiKhoan;
  $('f_' + loai + '_hinhthuc').value = p.hinhThuc;
  $('f_' + loai + '_no').value = p.no;
  $('f_' + loai + '_co').value = p.co;
  ATT_BUF['att_' + loai] = (p.files || []).slice();
  renderAttList(ATT_BUF['att_' + loai], 'att_' + loai);
  if (loai === 'PC') {
    pc33Toggle();
    pcCKToggle();
    // nạp lại thông tin ngân hàng bên thụ hưởng từ Ủy nhiệm chi đã lập cho phiếu này
    const cu = DB.unc.find(x => x.pcRef === p.id);
    if (cu) {
      $('pcck_ten').value = cu.nhanTen || ''; $('pcck_stk').value = cu.nhanSTK || '';
      $('pcck_nh').value = cu.nhanNH || ''; $('pcck_tinh').value = cu.nhanTinh || '';
      $('pcck_diachi').value = cu.nhanDiaChi || ''; $('pcck_phi').value = cu.phiBen || 'TT';
    }
  }
  if (loai === 'HU') { fillPURefs(p.puRef); huRefInfo(); }
  window.scrollTo(0, 0);
}
function delPhieu(id) {
  const p = DB.phieu.find(x => x.id === id); if (!p) return;
  showModal('Xóa phiếu', 'Xóa <b>' + esc(p.so) + '</b> (' + esc((p.dienGiai || '').slice(0, 60)) + ', ' + fmt(p.soTien) + ' đ)?<br>Sổ quỹ và báo cáo sẽ tự cập nhật lại.', [
    { text: 'Xóa phiếu', warn: true, onClick: function () { DB.phieu = DB.phieu.filter(x => x.id !== id); saveDB(); renderAll(); } },
    { text: 'Hủy', sec: true }
  ]);
}

/* ---------- Danh sách phiếu: lọc & sắp xếp ---------- */
const FILTERS = {};
const LIST_LOAI = { pt: ['PT'], pc: ['PC'], tu: ['PU', 'HU'] };
const LIST_STATE = {};
function listState(k) {
  if (!LIST_STATE[k]) LIST_STATE[k] = { q: '', nam: '', ma: '', ht: '', sortKey: 'ngay', sortDir: -1 };
  return LIST_STATE[k];
}
function setLF(k, field, v) { listState(k)[field] = v; refreshPhieuTable(k); }
function sortList(k, key) {
  const st = listState(k);
  if (st.sortKey === key) st.sortDir = -st.sortDir;
  else { st.sortKey = key; st.sortDir = (key === 'ngay' || key === 'soTien') ? -1 : 1; }
  refreshPhieuTable(k);
}
function clearLF(k) { LIST_STATE[k] = null; renderAll(); }
function soVal(so) {
  const m = /(\d+)\s*\/\s*(\d{2,4})/.exec(so || '');
  return m ? Number(m[2]) * 100000 + Number(m[1]) : 0;
}
function refreshPhieuTable(k) {
  const el = $('ptbl_' + k);
  if (el) el.innerHTML = phieuTableHTML(LIST_LOAI[k], k);
}
function phieuListHTML(loaiArr, modKey) {
  const st = listState(modKey);
  const dmKind = modKey === 'pt' ? 'THU' : modKey === 'pc' ? 'CHI' : 'ALL';
  const dmList = dmKind === 'THU' ? DM_THU : dmKind === 'CHI' ? DM_CHI : DM_THU.concat(DM_CHI);
  let h = '<div class="searchrow">' +
    '<input type="text" placeholder="Tìm theo số phiếu, ngày, tên, diễn giải…" value="' + esc(st.q) + '" oninput="setLF(\'' + modKey + '\',\'q\',this.value)">' +
    '<label style="font-size:12.5px">Năm: <select onchange="setLF(\'' + modKey + '\',\'nam\',this.value)"><option value="">Tất cả</option>' +
      namesOfYears().map(y => '<option value="' + y + '"' + (String(y) === String(st.nam) ? ' selected' : '') + '>' + y + '</option>').join('') + '</select></label>' +
    '<label style="font-size:12.5px">Mã số: <select onchange="setLF(\'' + modKey + '\',\'ma\',this.value)"><option value="">Tất cả</option>' +
      dmList.map(m => '<option value="' + m.ma + '"' + (m.ma === st.ma ? ' selected' : '') + '>' + m.ma + ' — ' + esc(m.ten.slice(0, 28)) + '</option>').join('') + '</select></label>' +
    '<label style="font-size:12.5px">Hình thức: <select onchange="setLF(\'' + modKey + '\',\'ht\',this.value)"><option value="">Tất cả</option>' +
      '<option value="TM"' + (st.ht === 'TM' ? ' selected' : '') + '>Tiền mặt</option><option value="CK"' + (st.ht === 'CK' ? ' selected' : '') + '>Chuyển khoản</option></select></label>' +
    '<button class="mini" onclick="clearLF(\'' + modKey + '\')">✕ Xóa lọc</button>' +
    '</div><div id="ptbl_' + modKey + '">' + phieuTableHTML(loaiArr, modKey) + '</div>';
  return h;
}
function phieuTableHTML(loaiArr, modKey) {
  const st = listState(modKey);
  const q = st.q.trim().toLowerCase();
  let list = DB.phieu.filter(p => loaiArr.indexOf(p.loai) >= 0);
  if (st.nam) list = list.filter(p => String(yearOf(p.ngay)) === String(st.nam));
  if (st.ma) list = list.filter(p => p.maSo === st.ma);
  if (st.ht) list = list.filter(p => p.hinhThuc === st.ht);
  if (q) list = list.filter(p =>
    (p.so || '').toLowerCase().indexOf(q) >= 0 ||
    (p.maSo || '').indexOf(q) >= 0 ||
    fmtDate(p.ngay).indexOf(q) >= 0 ||
    (p.nguoi || '').toLowerCase().indexOf(q) >= 0 ||
    (p.boPhan || '').toLowerCase().indexOf(q) >= 0 ||
    (p.dienGiai || '').toLowerCase().indexOf(q) >= 0);
  const dir = st.sortDir;
  list.sort((a, b) => {
    let r = 0;
    switch (st.sortKey) {
      case 'so': r = soVal(a.so) - soVal(b.so) || String(a.so).localeCompare(String(b.so), 'vi'); break;
      case 'loai': r = String(a.loai).localeCompare(b.loai); break;
      case 'nguoi': r = String(a.nguoi || '').localeCompare(String(b.nguoi || ''), 'vi'); break;
      case 'maSo': r = String(a.maSo || '').localeCompare(String(b.maSo || '')); break;
      case 'soTien': r = (a.soTien || 0) - (b.soTien || 0); break;
      case 'hinhThuc': r = String(a.hinhThuc).localeCompare(b.hinhThuc); break;
      default: r = String(a.ngay || '').localeCompare(String(b.ngay || '')) || String(a.createdAt || '').localeCompare(String(b.createdAt || ''));
    }
    return r * dir || soVal(a.so) - soVal(b.so);
  });
  const tong = list.reduce((s, p) => s + (p.soTien || 0), 0);
  function th(key, label, num) {
    const on = st.sortKey === key;
    return '<th class="sortable' + (on ? ' sorted' : '') + (num ? ' num' : '') + '" onclick="sortList(\'' + modKey + '\',\'' + key + '\')" title="Bấm để sắp xếp">' + label + (on ? (st.sortDir > 0 ? ' ▲' : ' ▼') : '') + '</th>';
  }
  let h = '<p class="note" style="margin-bottom:6px">Hiển thị <b>' + list.length + '</b> phiếu · Tổng tiền: <b>' + fmt(tong) + ' đ</b> · Bấm vào tiêu đề cột để sắp xếp.</p>' +
    '<div class="tblwrap"><table class="tbl"><tr>' +
    th('so', 'Số phiếu') + th('ngay', 'Ngày') + th('loai', 'Loại') +
    th('nguoi', modKey === 'pt' ? 'Người nộp' : 'Người nhận') +
    '<th>Diễn giải</th>' + th('maSo', 'Mã số') + th('soTien', 'Số tiền', true) + th('hinhThuc', 'HT') +
    '<th>Kèm</th><th>Thao tác</th></tr>';
  for (const p of list) {
    h += '<tr><td><b>' + esc(p.so) + '</b></td><td>' + fmtDate(p.ngay) + '</td>' +
      '<td><span class="badge ' + p.loai.toLowerCase() + '">' + p.loai + '</span></td>' +
      '<td>' + esc(p.nguoi) + (p.boPhan ? '<div class="hint">' + esc(p.boPhan) + '</div>' : '') + '</td>' +
      '<td class="wrap">' + esc(p.dienGiai || '').replace(/\n/g, '<br>') +
      (p.loai === 'HU' && p.puRef ? '<div class="hint">↩ hoàn cho ' + esc((DB.phieu.find(x => x.id === p.puRef) || {}).so || '?') + '</div>' : '') + '</td>' +
      '<td>' + esc(p.maSo) + '</td><td class="num">' + fmt(p.soTien) + '</td>' +
      '<td><span class="badge ' + (p.hinhThuc === 'TM' ? 'tm' : 'ck') + '">' + (p.hinhThuc === 'TM' ? 'TM' : 'CK') + '</span></td>' +
      '<td>' + ((p.files || []).length ? '📎' + p.files.length : '') + '</td>' +
      '<td><button class="mini" onclick="printPhieu(\'' + p.id + '\')">🖨 In</button>' +
      '<button class="mini" onclick="editPhieu(\'' + p.id + '\')">✎ Sửa</button>' +
      (p.loai === 'PC' && p.hinhThuc === 'CK'
        ? (function () {
            const cu = DB.unc.find(x => x.pcRef === p.id);
            return cu
              ? '<button class="mini" onclick="printUNC(\'' + cu.id + '\')" title="In Ủy nhiệm chi ' + esc(cu.so) + ' theo mẫu ngân hàng">🖨 UNC</button>'
              : '<button class="mini" onclick="inNhanhUNC(\'' + p.id + '\')" title="Lập nhanh Ủy nhiệm chi rồi in ngay">⚡ UNC</button>';
          })()
        : '') +
      '<button class="mini del" onclick="delPhieu(\'' + p.id + '\')">✕</button></td></tr>';
  }
  if (!list.length) h += '<tr><td colspan="10" class="note" style="text-align:center;padding:14px">Không có phiếu nào khớp bộ lọc.</td></tr>';
  return h + '</table></div>';
}

function ocbSo(n) { return (Number(n) || 0).toLocaleString('en-US'); }
/* Ô giá trị trên mẫu: chữ dài thì tự nhỏ lại cho vừa dòng, không cắt mất nội dung.
   `max` = số ký tự vừa đủ một dòng của ô đó ở cỡ chữ 8,5pt. */
function ocbV(val, max, extra) {
  const s = String(val == null ? '' : val), n = s.length;
  const cls = n > max * 1.35 ? ' xs' : (n > max ? ' sm' : '');
  return '<span class="ov' + cls + '"' + (extra ? ' style="' + extra + '"' : '') + '>' + esc(s) + '</span>';
}

/* Sau khi dựng xong mẫu: đo thật rồi giảm cỡ chữ từng bước cho tới khi vừa ô,
   bảo đảm không có nội dung nào bị cắt mất khi in (tên đơn vị / ngân hàng rất dài…). */
function ocbFitAll() {
  const pa = $('printArea');
  if (!pa.querySelector('.ocb')) return;
  // #printArea bị ẩn nên không đo được — tạm đưa ra ngoài khung nhìn để đo, rồi trả lại y như cũ
  const prev = pa.getAttribute('style');
  pa.style.cssText = 'display:block;position:absolute;left:-10000px;top:0;width:200mm';
  const px2pt = px => px * 72 / 96;
  const co = (el, vertical) => {
    let pt = px2pt(parseFloat(getComputedStyle(el).fontSize)), g = 40;
    const qua = () => vertical ? el.scrollHeight > el.clientHeight + 1 : el.scrollWidth > el.clientWidth + 1;
    while (qua() && pt > 5 && g--) { pt -= 0.25; el.style.fontSize = pt.toFixed(2) + 'pt'; }
  };
  pa.querySelectorAll('.ocb .ov').forEach(e => co(e, false));
  pa.querySelectorAll('.ocb .otrans').forEach(e => co(e, false));   // mã giao dịch dài vẫn không bị cắt
  pa.querySelectorAll('.ocb .ond').forEach(e => co(e, true));
  if (prev === null) pa.removeAttribute('style'); else pa.setAttribute('style', prev);
}

/* ================================================================
   SỔ QUỸ TIỀN MẶT & SỔ TK NGÂN HÀNG
   ================================================================ */
function getSoDu(nam) {
  const sd = DB.settings.soDu[nam] || { TM: 0, NH: 0 };
  return { TM: Number(sd.TM) || 0, NH: Number(sd.NH) || 0 };
}
function ledgerEntries(kind, nam) {
  // kind: 'TM' | 'CK'  — PT/HU: tiền vào; PC/PU: tiền ra
  return DB.phieu
    .filter(p => p.hinhThuc === kind && yearOf(p.ngay) === nam)
    .sort((a, b) => (a.ngay || '').localeCompare(b.ngay || '') || (a.createdAt || '').localeCompare(b.createdAt || ''));
}
function balanceAt(kind, nam, uptoISO) {
  // số dư từ đầu năm `nam` đến hết ngày uptoISO (bao gồm)
  const open = getSoDu(nam)[kind === 'TM' ? 'TM' : 'NH'];
  let bal = open;
  for (const p of ledgerEntries(kind, nam)) {
    if (uptoISO && p.ngay > uptoISO) continue;
    bal += (p.loai === 'PT' || p.loai === 'HU') ? p.soTien : -p.soTien;
  }
  return bal;
}
const soState = { namTM: null, namNH: null };
function ledgerTableHTML(kind, nam, filterKey) {
  const f = (FILTERS[filterKey] || '').toLowerCase();
  const open = getSoDu(nam)[kind === 'TM' ? 'TM' : 'NH'];
  const entries = ledgerEntries(kind, nam);
  const colThu = kind === 'TM' ? 'Thu (VNĐ)' : 'Gửi vào (VNĐ)';
  const colChi = kind === 'TM' ? 'Chi (VNĐ)' : 'Rút ra (VNĐ)';
  const colTon = kind === 'TM' ? 'Tồn quỹ (VNĐ)' : 'Còn lại (VNĐ)';
  let bal = open, tThu = 0, tChi = 0;
  let rows = '<tr class="sum"><td colspan="5">Số dư đầu kỳ</td><td class="num">' + fmt(open) + '</td><td class="num"></td><td class="num">' + fmt(open) + '</td></tr>';
  for (const p of entries) {
    const vao = (p.loai === 'PT' || p.loai === 'HU') ? p.soTien : 0;
    const ra = vao ? 0 : p.soTien;
    bal += vao - ra; tThu += vao; tChi += ra;
    const match = !f || (p.so || '').toLowerCase().indexOf(f) >= 0 || fmtDate(p.ngay).indexOf(f) >= 0 || (p.maSo || '').indexOf(f) >= 0 || (p.dienGiai || '').toLowerCase().indexOf(f) >= 0;
    if (!match) continue;
    rows += '<tr><td>' + fmtDate(p.ngay) + '</td><td>' + (vao ? '<b>' + esc(p.so) + '</b>' : '') + '</td><td>' + (ra ? '<b>' + esc(p.so) + '</b>' : '') + '</td><td>' + esc(p.maSo) + '</td><td>' + esc(p.dienGiai) + '</td>' +
      '<td class="num">' + (vao ? fmt(vao) : '') + '</td><td class="num">' + (ra ? fmt(ra) : '') + '</td><td class="num">' + fmt(bal) + '</td></tr>';
  }
  rows += '<tr class="sum"><td colspan="5">Cộng phát sinh & tồn cuối kỳ</td><td class="num">' + fmt(tThu) + '</td><td class="num">' + fmt(tChi) + '</td><td class="num">' + fmt(open + tThu - tChi) + '</td></tr>';
  return '<div class="tblwrap"><table class="tbl"><tr><th>Ngày</th><th>Số phiếu Thu</th><th>Số phiếu Chi</th><th>Mã số</th><th>Diễn giải</th><th class="num">' + colThu + '</th><th class="num">' + colChi + '</th><th class="num">' + colTon + '</th></tr>' + rows + '</table></div>';
}

function setSoDu(nam, kind, val) {
  if (!DB.settings.soDu[nam]) DB.settings.soDu[nam] = { TM: 0, NH: 0 };
  DB.settings.soDu[nam][kind] = parseMoney(val);
  saveDB(); renderAll();
}
function namesOfYears() {
  const cur = new Date().getFullYear();
  const set = new Set([cur, cur - 1, cur + 1]);
  DB.phieu.forEach(p => { const y = yearOf(p.ngay); if (y) set.add(y); });
  Object.keys(DB.settings.soDu || {}).forEach(y => set.add(Number(y)));
  return Array.from(set).filter(Boolean).sort();
}

/* ================================================================
   BÁO CÁO QUYẾT TOÁN QUÝ (B07/TLĐ)
   ================================================================ */
const bcState = { quy: Math.ceil((new Date().getMonth() + 1) / 3), nam: new Date().getFullYear() };
function quarterRange(quy, nam) {
  const m1 = (quy - 1) * 3 + 1, m2 = quy * 3;
  const from = nam + '-' + String(m1).padStart(2, '0') + '-01';
  const lastDay = new Date(nam, m2, 0).getDate();
  const to = nam + '-' + String(m2).padStart(2, '0') + '-' + String(lastDay).padStart(2, '0');
  return { from: from, to: to };
}
function sumMa(loai, ma, fromISO, toISO) {
  return DB.phieu.filter(p => p.loai === loai && p.maSo === ma && p.ngay >= fromISO && p.ngay <= toISO).reduce((s, p) => s + p.soTien, 0);
}
function baoCaoData(quy, nam) {
  const r = quarterRange(quy, nam);
  const y1 = nam + '-01-01';
  const dayBefore = new Date(new Date(r.from).getTime() - 86400000);
  const beforeISO = dayBefore.getFullYear() + '-' + String(dayBefore.getMonth() + 1).padStart(2, '0') + '-' + String(dayBefore.getDate()).padStart(2, '0');
  const d = { thu: {}, chi: {}, thuLK: {}, chiLK: {} };
  DM_THU.forEach(m => { d.thu[m.ma] = sumMa('PT', m.ma, r.from, r.to); d.thuLK[m.ma] = sumMa('PT', m.ma, y1, r.to); });
  DM_CHI.forEach(m => { d.chi[m.ma] = sumMa('PC', m.ma, r.from, r.to); d.chiLK[m.ma] = sumMa('PC', m.ma, y1, r.to); });
  // Mã 26 — số dư kỳ trước chuyển sang (không lấy theo phiếu mà theo số dư sổ)
  const sd = getSoDu(nam);
  d.duTM_ky = quy === 1 ? sd.TM : balanceAt('TM', nam, beforeISO);
  d.duNH_ky = quy === 1 ? sd.NH : balanceAt('CK', nam, beforeISO);
  d.duTM_lk = sd.TM; d.duNH_lk = sd.NH;
  d.congThu_ky = d.thu['22'] + d.thu['23'] + d.thu['24'];
  d.congThu_lk = d.thuLK['22'] + d.thuLK['23'] + d.thuLK['24'];
  d.duKyTruoc_ky = d.duTM_ky + d.duNH_ky;
  d.duKyTruoc_lk = d.duTM_lk + d.duNH_lk;
  d.tongThu_ky = d.congThu_ky + d.thu['25'] + d.duKyTruoc_ky;
  d.tongThu_lk = d.congThu_lk + d.thuLK['25'] + d.duKyTruoc_lk;
  const chiMuc = ['27', '28', '29', '31', '33', '35'];
  d.congChi_ky = chiMuc.reduce((s, m) => s + d.chi[m], 0);
  d.congChi_lk = chiMuc.reduce((s, m) => s + d.chiLK[m], 0);
  d.tongChi_ky = d.congChi_ky + d.chi['36'] + d.chi['37'] + d.chi['49'];
  d.tongChi_lk = d.congChi_lk + d.chiLK['36'] + d.chiLK['37'] + d.chiLK['49'];
  d.duCuoiKy = balanceAt('TM', nam, r.to) + balanceAt('CK', nam, r.to);
  d.kpPhaiNop_ky = Math.round(d.thu['22'] * 0.29); d.kpPhaiNop_lk = Math.round(d.thuLK['22'] * 0.29);
  d.dpPhaiNop_ky = Math.round(d.thu['23'] * 0.40); d.dpPhaiNop_lk = Math.round(d.thuLK['23'] * 0.40);
  return d;
}
function baoCaoTableHTML(quy, nam, forPrint) {
  const d = baoCaoData(quy, nam);
  const cls = forPrint ? 'ptbl' : 'tbl';
  function row(muc, noiDung, ma, ky, lk, bold) {
    return '<tr' + (bold ? ' class="sum"' : '') + '><td class="center">' + muc + '</td><td' + (bold ? ' class="b"' : '') + '>' + noiDung + '</td><td class="center">' + ma + '</td>' +
      '<td class="num' + (bold ? ' b' : '') + '">' + (ky === '' ? '' : fmt(ky)) + '</td><td class="num' + (bold ? ' b' : '') + '">' + (lk === '' ? '' : fmt(lk)) + '</td><td></td></tr>';

function pcapSet(ri, k, v) { pcapRows()[ri][k] = v.trim(); saveDB(); }

function pcapDelRow(ri) {
  showModal('Xóa dòng', 'Xóa dòng "<b>' + esc(pcapRows()[ri].hoTen || '(trống)') + '</b>"?', [

}

    .forEach(function (id) { const el = $(id); if (el) el.dataset.init = el.value; });

function saveSettings() {
  const s = DB.settings;
  // CHỈ ghi những ô người dùng thực sự sửa. Nếu ô không đụng tới thì giữ nguyên giá trị
  // trong DB — vì màn hình Cài đặt không tự vẽ lại khi có cập nhật từ máy khác, ghi đè
  // nguyên cả cụm sẽ làm mất thay đổi vừa đồng bộ về (đã từng làm số dư đầu kỳ về 0).

function exportData() {
  const d = new Date();
  const name = 'congdoan-data-' + d.getFullYear() + String(d.getMonth() + 1).padStart(2, '0') + String(d.getDate()).padStart(2, '0') + '-' + String(d.getHours()).padStart(2, '0') + String(d.getMinutes()).padStart(2, '0') + '.json';
  const blob = new Blob([JSON.stringify(DB, null, 1)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
}
function importFromFile(input) {
  const f = input.files[0];
  input.value = '';
  if (!f) return;
  const rd = new FileReader();
  rd.onload = function () {
    let inc;
    try { inc = JSON.parse(rd.result); } catch (e) { alert('File không đúng định dạng JSON: ' + e.message); return; }
    if (!inc || !Array.isArray(inc.phieu)) { alert('File không phải dữ liệu của ứng dụng này.'); return; }
    chooseImportMode(inc, 'file "' + f.name + '"');
  };
  rd.readAsText(f, 'utf-8');
}
function chooseImportMode(inc, srcDesc) {
  showModal('Nhập dữ liệu', 'Nhập từ ' + esc(srcDesc) + ' (' + (inc.phieu || []).length + ' phiếu, ' + (inc.unc || []).length + ' UNC).<br><br><b>Ghi đè</b>: thay toàn bộ dữ liệu hiện tại bằng dữ liệu trong file.<br><b>Gộp</b>: chỉ thêm phiếu chưa có (bỏ qua phiếu trùng số).', [
    { text: 'Ghi đè toàn bộ', warn: true, onClick: function () { DB = inc; loadDBFix(); saveDB(); reRenderAllModules(); alert('Đã ghi đè dữ liệu.'); } },
    { text: 'Gộp (merge)', onClick: function () { const n = mergeData(inc); saveDB(); reRenderAllModules(); alert('Đã gộp: thêm ' + n.p + ' phiếu, ' + n.u + ' UNC.'); } },
    { text: 'Hủy', sec: true }
  ]);
}
function loadDBFix() {
  const d = defaultDB();
  for (const k in d) if (DB[k] === undefined) DB[k] = d[k];
  for (const k in d.settings) if (DB.settings[k] === undefined) DB.settings[k] = d.settings[k];
  migrateData();
}
function mergeData(inc) {
  let np = 0, nu = 0;
  const haveP = new Set(DB.phieu.map(p => p.loai + '|' + p.so));
  (inc.phieu || []).forEach(p => { if (!haveP.has(p.loai + '|' + p.so)) { DB.phieu.push(p); np++; } });
  const haveU = new Set(DB.unc.map(u => u.so));
  (inc.unc || []).forEach(u => { if (!haveU.has(u.so)) { DB.unc.push(u); nu++; } });
  for (const y in (inc.kpdp || {})) if (!DB.kpdp[y]) DB.kpdp[y] = inc.kpdp[y];
  const haveTV = new Set(DB.thamVieng.map(r => JSON.stringify(r)));
  (inc.thamVieng || []).forEach(r => { if (!haveTV.has(JSON.stringify(r))) DB.thamVieng.push(r); });
  for (const k in (inc.phuCap || {})) if (!DB.phuCap[k]) DB.phuCap[k] = inc.phuCap[k];
  const st = inc.settings || {};
  for (const y in (st.soDu || {})) if (!DB.settings.soDu[y]) DB.settings.soDu[y] = st.soDu[y];
  for (const y in (st.chiTieu || {})) if (!DB.settings.chiTieu[y]) DB.settings.chiTieu[y] = st.chiTieu[y];
  migrateData();   // cấp mã id cho các dòng nhập từ file cũ (cần cho đồng bộ)
  return { p: np, u: nu };
}
function reRenderAllModules() {
  document.querySelectorAll('.module').forEach(m => { m.innerHTML = ''; delete m.dataset.init; });
  goMod(currentMod);
}

/* ================================================================
   ĐỒNG BỘ SUPABASE — REST (PostgREST) + Realtime (WebSocket thuần)
   Không dùng thư viện ngoài. Tắt đồng bộ → app chạy 100% offline như cũ.
   ================================================================ */
/* CẤU HÌNH NHÚNG SẴN (tùy chọn) — điền vào đây thì mở file lên là tự đồng bộ ngay,
   không phải nhập tay trên từng máy.
   ⚠ CHỈ điền khi bản HTML này KHÔNG nằm ở nơi công khai. Bản trên GitHub Pages
   (rachel-huynh.github.io) ai trên mạng cũng mở và xem mã nguồn được — điền key vào đó
   là công khai toàn bộ sổ quỹ công đoàn cho người lạ sửa. Với bản công khai, hãy dùng
   nút "Tạo link cài sẵn" trong Cài đặt để gửi riêng cho từng người. */
const SB_PRESET = { url: '', key: '' };

const SB_T = { phieu: 'cd_phieu', unc: 'cd_unc', tv: 'cd_tham_vieng', kv: 'cd_kv', file: 'cd_file' };
const SB_KINDS = ['phieu', 'unc', 'tv', 'kv'];
const SB_OUT_KEY = 'cdcs_outbox_v1';
const SB_DEVICE = (function () {
  let d = '';
  try { d = localStorage.getItem('cdcs_device_id') || ''; } catch (e) { }
  if (!d) { d = 'may-' + Math.random().toString(36).slice(2, 8); try { localStorage.setItem('cdcs_device_id', d); } catch (e) { } }
  return d;
})();
let SB_SNAP = null;        // ảnh chụp trạng thái đã đồng bộ, để tính thay đổi
let SB_APPLYING = false;   // đang áp thay đổi từ máy khác → không đẩy ngược lên
let SB_OUT = [];           // hàng đợi gửi lên (giữ lại được khi mất mạng)
let SB_DEAD = [];          // các mục gửi mãi không được (để báo cho người dùng)
let SB_FLUSHING = false;
let SB_WS = null, SB_HB = null, SB_RETRY = 0, SB_RETRY_TIMER = null;
let SB_STATE = 'off', SB_STATE_MSG = '';
let SB_API_OK = null;   // null=chưa thử, true=đọc/ghi bảng được, false=bảng chưa tạo hoặc bị chặn

function sbCfg() {
  const s = (DB && DB.settings && DB.settings.sb) || {};
  return { enabled: !!s.enabled, url: String(s.url || '').trim().replace(/\/+$/, ''), key: String(s.key || '').trim() };
}
function sbOn() { const c = sbCfg(); return !!(c.enabled && c.url && c.key); }
function sbPk(kind) { return kind === 'kv' ? 'k' : 'id'; }
async function sbReq(path, opts) {
  const c = sbCfg();
  if (!c.url || !c.key) throw new Error('Chưa nhập Project URL / API key của Supabase.');
  opts = opts || {};
  const res = await fetch(c.url + '/rest/v1/' + path, {
    method: opts.method || 'GET',
    headers: Object.assign({ apikey: c.key, Authorization: 'Bearer ' + c.key, 'Content-Type': 'application/json' }, opts.headers || {}),
    body: opts.body
  });
  if (!res.ok) {
    let t = await res.text();
    try { const j = JSON.parse(t); t = (j.message || t) + (j.hint ? ' — ' + j.hint : ''); } catch (e) { }
    if (/cd_[a-z_]*/.test(t) && /schema cache|does not exist|relation/i.test(t)) {
      t += ' → Bảng chưa được tạo. Hãy chạy file congdoan-supabase.sql trong Supabase → SQL Editor.';
    }
    SB_API_OK = false; sbPill();     // đèn trạng thái phải báo lỗi, không được báo "Trực tuyến"
    throw new Error('HTTP ' + res.status + ': ' + t.slice(0, 300));
  }
  SB_API_OK = true;
  const txt = await res.text();
  return txt ? JSON.parse(txt) : null;
}
async function sbFetchAll(table, extra) {
  const out = [], step = 500;
  for (let from = 0; ; from += step) {
    const rows = await sbReq(table + '?select=*' + (extra || '') + '&order=' + (table === SB_T.kv ? 'k' : 'id') + '&limit=' + step + '&offset=' + from);
    if (!rows || !rows.length) break;
    out.push.apply(out, rows);
    if (rows.length < step) break;
  }
  return out;
}

/* ---------- Chuyển đổi giữa dữ liệu app (camelCase) và bảng (snake_case) ---------- */

function sbUncFromRow(r, old) {

function sbRowTv(t) {

function sbTvFromRow(r) {

    thamBenh: Number(r.tham_benh) || 0, thamVieng: Number(r.tham_vieng) || 0,

  };

/* Các mục dạng khóa–giá trị (cài đặt đơn vị, số dư, bảng kê…) */
function sbKvEntries() {
  const s = DB.settings, out = [];
  out.push(['org', { capTren: s.capTren, donVi: s.donVi, diaChi: s.diaChi, keToan: s.keToan, chuTich: s.chuTich, thuQuy: s.thuQuy, nhTen: s.nhTen, nhSTK: s.nhSTK, nhNganHang: s.nhNganHang, nhChiNhanh: s.nhChiNhanh || '', nhDiaChi: s.nhDiaChi || '' }]);
  out.push(['nguoinhan', s.nguoiNhan || {}]);
  out.push(['sodu', s.soDu || {}]);
  out.push(['chitieu', s.chiTieu || {}]);
  for (const y in (DB.kpdp || {})) out.push(['kpdp:' + y, DB.kpdp[y]]);
  for (const k in (DB.phuCap || {})) out.push(['phucap:' + k, DB.phuCap[k]]);
  return out;
}
function sbKvValue(k) { const e = sbKvEntries().find(x => x[0] === k); return e ? e[1] : null; }
function sbApplyKv(k, v) {
  if (v == null) return;
  if (k === 'org') ['capTren', 'donVi', 'diaChi', 'keToan', 'chuTich', 'thuQuy', 'nhTen', 'nhSTK', 'nhNganHang', 'nhChiNhanh', 'nhDiaChi'].forEach(f => { if (v[f] !== undefined) DB.settings[f] = v[f]; });
  else if (k === 'nguoinhan') DB.settings.nguoiNhan = Object.assign({}, DB.settings.nguoiNhan || {}, v);
  else if (k === 'sodu') DB.settings.soDu = v;
  else if (k === 'chitieu') DB.settings.chiTieu = v;
  else if (k.indexOf('kpdp:') === 0) DB.kpdp[k.slice(5)] = v;
  else if (k.indexOf('phucap:') === 0) DB.phuCap[k.slice(7)] = v;
}
function sbKvLabel(k) {
  if (k === 'org') return 'thông tin đơn vị';
  if (k === 'nguoinhan') return 'danh bạ bên thụ hưởng';
  if (k === 'sodu') return 'số dư đầu kỳ';
  if (k === 'chitieu') return 'chỉ tiêu cơ bản';
  if (k.indexOf('kpdp:') === 0) return 'bảng kê KP&ĐP ' + k.slice(5);
  if (k.indexOf('phucap:') === 0) return 'bảng kê phụ cấp ' + k.slice(7);
  return k;
}

/* ---------- Phát hiện thay đổi cục bộ & hàng đợi gửi lên ---------- */
function sbFileSig(o) { return (o.files || []).map(f => (f.name || '') + ':' + String(f.data || '').length).join(','); }
function sbSnapshot() {
  const s = { phieu: {}, unc: {}, tv: {}, kv: {} };
  (DB.phieu || []).forEach(p => { s.phieu[p.id] = { r: JSON.stringify(sbRowPhieu(p)), f: sbFileSig(p) }; });
  (DB.unc || []).forEach(u => { s.unc[u.id] = { r: JSON.stringify(sbRowUnc(u)), f: sbFileSig(u) }; });
  (DB.thamVieng || []).forEach(t => { s.tv[t.id] = { r: JSON.stringify(sbRowTv(t)), f: '' }; });
  sbKvEntries().forEach(e => { s.kv[e[0]] = { r: JSON.stringify(e[1]), f: '' }; });
  return s;
}
function sbAfterSave() {
  if (!sbOn()) return;
  if (SB_APPLYING || !SB_SNAP) { SB_SNAP = sbSnapshot(); return; }   // mốc so sánh, không đẩy
  const cur = sbSnapshot();
  let n = 0;
  SB_KINDS.forEach(k => {
    for (const id in cur[k]) {
      const a = SB_SNAP[k][id], b = cur[k][id];
      if (!a || a.r !== b.r || a.f !== b.f) { sbQueue(k, 'up', id, !a || a.f !== b.f); n++; }
    }
    for (const id in SB_SNAP[k]) if (!cur[k][id]) { sbQueue(k, 'del', id, false); n++; }
  });
  SB_SNAP = cur;
  if (n) sbFlush();
}
function sbQueue(k, t, id, withFiles) {
  const i = SB_OUT.findIndex(o => o.k === k && o.id === id);
  if (i >= 0) { SB_OUT[i].t = t; SB_OUT[i].f = SB_OUT[i].f || !!withFiles; }
  else SB_OUT.push({ k: k, t: t, id: id, f: !!withFiles });
  sbSaveOut();
}
function sbSaveOut() { try { localStorage.setItem(SB_OUT_KEY, JSON.stringify(SB_OUT)); } catch (e) { } sbPill(); }
function sbSaveDead() { try { localStorage.setItem(SB_OUT_KEY + '_dead', JSON.stringify(SB_DEAD.slice(-50))); } catch (e) { } }
function sbLoadOut() {
  try { SB_OUT = JSON.parse(localStorage.getItem(SB_OUT_KEY) || '[]') || []; } catch (e) { SB_OUT = []; }
  try { SB_DEAD = JSON.parse(localStorage.getItem(SB_OUT_KEY + '_dead') || '[]') || []; } catch (e) { SB_DEAD = []; }
}
function sbBuildRow(k, id) {
  if (k === 'phieu') { const p = (DB.phieu || []).find(x => x.id === id); return p ? { row: sbRowPhieu(p), files: p.files || [] } : null; }
  if (k === 'unc') { const u = (DB.unc || []).find(x => x.id === id); return u ? { row: sbRowUnc(u), files: u.files || [] } : null; }
  if (k === 'tv') { const t = (DB.thamVieng || []).find(x => x.id === id); return t ? { row: sbRowTv(t), files: null } : null; }
  if (k === 'kv') { const v = sbKvValue(id); return v == null ? null : { row: { k: id, v: v }, files: null }; }
  return null;
}
async function sbUpsert(kind, row) {
  row.updated_at = new Date().toISOString();
  row.updated_by = SB_DEVICE;
  await sbReq(SB_T[kind], { method: 'POST', headers: { Prefer: 'resolution=merge-duplicates,return=minimal' }, body: JSON.stringify(row) });
}
async function sbPushFiles(ownerId, files) {
  await sbReq(SB_T.file + '?owner_id=eq.' + encodeURIComponent(ownerId), { method: 'DELETE' });
  for (let i = 0; i < (files || []).length; i++) {
    const f = files[i];
    await sbReq(SB_T.file, {
      method: 'POST', headers: { Prefer: 'resolution=merge-duplicates,return=minimal' },
      body: JSON.stringify({ id: ownerId + '#' + i, owner_id: ownerId, ten: f.name || ('file-' + (i + 1)), loai: f.type || '', data: f.data || '' })
    });
  }
}
function sbIsNetErr(e) {
  return (typeof navigator !== 'undefined' && navigator.onLine === false) ||
    /Failed to fetch|NetworkError|Load failed|network/i.test(e && e.message || '');
}
async function sbFlush() {
  if (!sbOn() || SB_FLUSHING || !SB_OUT.length) return;
  SB_FLUSHING = true; sbPill();
  let sent = 0;
  try {
    while (SB_OUT.length) {
      const op = SB_OUT[0];
      try {
        if (op.t === 'del') {
          await sbReq(SB_T[op.k] + '?' + sbPk(op.k) + '=eq.' + encodeURIComponent(op.id), { method: 'DELETE' });
          if (op.k === 'phieu' || op.k === 'unc') await sbReq(SB_T.file + '?owner_id=eq.' + encodeURIComponent(op.id), { method: 'DELETE' });
        } else {
          const b = sbBuildRow(op.k, op.id);
          if (b) {
            await sbUpsert(op.k, b.row);
            if (op.f && b.files) await sbPushFiles(op.id, b.files);
          }
        }
        SB_OUT.shift(); sbSaveOut(); sent++;
      } catch (e) {
        SB_STATE_MSG = e.message;
        op.n = (op.n || 0) + 1;
        // Lỗi mạng → dừng, giữ nguyên hàng đợi, thử lại sau.
        // Lỗi dữ liệu (sai cột, vi phạm ràng buộc…) → thử 3 lần rồi để riêng,
        // không để 1 mục hỏng chặn toàn bộ các thay đổi phía sau.
        if (sbIsNetErr(e) || op.n < 3) throw e;
        SB_OUT.shift();
        SB_DEAD.push({ k: op.k, id: op.id, t: op.t, err: e.message, at: new Date().toLocaleString('vi-VN') });
        sbSaveDead();
        console.warn('Supabase — bỏ qua mục lỗi:', op, e.message);
      }
    }
    if (sent) {
      DB.settings.sb.lastPush = new Date().toLocaleString('vi-VN');
      try { localStorage.setItem(STORE_KEY, JSON.stringify(DB)); } catch (e) { }
    }
  } catch (e) {
    SB_STATE_MSG = e.message;
    console.warn('Supabase:', e.message);
    setTimeout(sbFlush, 15000);   // thử lại sau
  }
  SB_FLUSHING = false; sbPill();
}

/* ---------- Tải toàn bộ về / Đẩy toàn bộ lên ---------- */
async function sbPullAll(replace, silent) {
  const ph = await sbFetchAll(SB_T.phieu);
  const un = await sbFetchAll(SB_T.unc);
  const tv = await sbFetchAll(SB_T.tv);
  const kv = await sbFetchAll(SB_T.kv);
  let files = [];
  if (ph.some(r => r.has_files) || un.some(r => r.has_files)) files = await sbFetchAll(SB_T.file);
  const byOwner = {};
  files.forEach(f => { (byOwner[f.owner_id] = byOwner[f.owner_id] || []).push(f); });
  const mkFiles = id => (byOwner[id] || []).sort((a, b) => String(a.id).localeCompare(String(b.id))).map(f => ({ name: f.ten, type: f.loai, data: f.data }));
  SB_APPLYING = true;
  if (replace) { DB.phieu = []; DB.unc = []; DB.thamVieng = []; }
  const ip = {}; DB.phieu.forEach((p, i) => ip[p.id] = i);
  ph.forEach(r => { const np = sbPhieuFromRow(r, DB.phieu[ip[r.id]]); if (r.has_files) np.files = mkFiles(r.id); if (ip[r.id] !== undefined) DB.phieu[ip[r.id]] = np; else DB.phieu.push(np); });
  const iu = {}; DB.unc.forEach((u, i) => iu[u.id] = i);
  un.forEach(r => { const nu = sbUncFromRow(r, DB.unc[iu[r.id]]); if (r.has_files) nu.files = mkFiles(r.id); if (iu[r.id] !== undefined) DB.unc[iu[r.id]] = nu; else DB.unc.push(nu); });
  const it = {}; DB.thamVieng.forEach((t, i) => it[t.id] = i);
  tv.forEach(r => { const nt = sbTvFromRow(r); if (it[r.id] !== undefined) DB.thamVieng[it[r.id]] = nt; else DB.thamVieng.push(nt); });
  kv.forEach(r => sbApplyKv(r.k, r.v));
  DB.settings.sb.lastPull = new Date().toLocaleString('vi-VN');
  saveDB();
  SB_APPLYING = false;
  SB_SNAP = sbSnapshot();
  if (!silent) reRenderAllModules(); else sbRefreshUI();
  return { p: ph.length, u: un.length, t: tv.length, k: kv.length };
}
function sbKvIsEmpty(k, v) {
  if (v == null) return true;
  if (Array.isArray(v)) return v.length === 0;
  if (typeof v !== 'object') return false;
  const keys = Object.keys(v);
  if (!keys.length) return true;
  if (k === 'sodu') return keys.every(y => !((v[y] || {}).TM) && !((v[y] || {}).NH));
  if (k === 'org') return keys.every(f => !v[f]);
  return false;
}
async function sbPushAll(onProgress) {
  const items = [];
  (DB.phieu || []).forEach(p => items.push({ k: 'phieu', id: p.id, f: true }));
  (DB.unc || []).forEach(u => items.push({ k: 'unc', id: u.id, f: true }));
  (DB.thamVieng || []).forEach(t => items.push({ k: 'tv', id: t.id, f: false }));
  // Không đẩy các mục cài đặt còn trống — máy mới chưa có dữ liệu mà đẩy lên
  // sẽ xóa trắng cài đặt (số dư đầu kỳ, thông tin đơn vị…) của mọi người.
  sbKvEntries().forEach(e => { if (!sbKvIsEmpty(e[0], e[1])) items.push({ k: 'kv', id: e[0], f: false }); });
  for (let i = 0; i < items.length; i++) {
    const b = sbBuildRow(items[i].k, items[i].id);
    if (b) {
      await sbUpsert(items[i].k, b.row);
      if (items[i].f && b.files && b.files.length) await sbPushFiles(items[i].id, b.files);
    }
    if (onProgress && (i % 10 === 0 || i === items.length - 1)) onProgress(i + 1, items.length);
  }
  DB.settings.sb.lastPush = new Date().toLocaleString('vi-VN');
  saveDB();
  SB_SNAP = sbSnapshot();
  return items.length;
}

/* ---------- Realtime: WebSocket theo giao thức Phoenix của Supabase ---------- */
function sbConnect() {
  sbDisconnect();
  if (!sbOn()) { sbSetState('off'); return; }
  const c = sbCfg();
  let ws;
  try { ws = new WebSocket(c.url.replace(/^http/, 'ws') + '/realtime/v1/websocket?apikey=' + encodeURIComponent(c.key) + '&vsn=1.0.0'); }
  catch (e) { sbSetState('err', e.message); return; }
  SB_WS = ws;
  sbSetState('connecting');
  ws.onopen = function () {
    ws.send(JSON.stringify({
      topic: 'realtime:congdoan', event: 'phx_join', ref: '1',
      payload: {
        config: {
          broadcast: { self: false }, presence: { key: '' },
          postgres_changes: SB_KINDS.map(k => ({ event: '*', schema: 'public', table: SB_T[k] }))
        },
        access_token: c.key
      }
    }));
    SB_HB = setInterval(function () {
      if (ws.readyState === 1) ws.send(JSON.stringify({ topic: 'phoenix', event: 'heartbeat', payload: {}, ref: String(Date.now()) }));
    }, 25000);
  };
  ws.onmessage = function (ev) {
    let m; try { m = JSON.parse(ev.data); } catch (e) { return; }
    if (m.event === 'phx_reply' && m.ref === '1') {
      if (m.payload && m.payload.status === 'ok') { SB_RETRY = 0; sbSetState('live'); }
      else sbSetState('err', (m.payload && m.payload.response && (m.payload.response.reason || m.payload.response.message)) || 'không tham gia được kênh realtime');
    } else if (m.event === 'postgres_changes' && m.payload && m.payload.data) {
      sbApplyRemote(m.payload.data);
    } else if (m.event === 'system' && m.payload && m.payload.status === 'error') {
      sbSetState('err', m.payload.message || 'lỗi kênh realtime');
    }
  };
  ws.onerror = function () { sbSetState('err', 'không kết nối được máy chủ realtime'); };
  ws.onclose = function () {
    if (SB_HB) { clearInterval(SB_HB); SB_HB = null; }
    if (SB_WS === ws) SB_WS = null;
    if (!sbOn()) { sbSetState('off'); return; }
    sbSetState('offline');
    SB_RETRY++;
    const wait = Math.min(30000, 2000 * SB_RETRY);
    if (SB_RETRY_TIMER) clearTimeout(SB_RETRY_TIMER);
    SB_RETRY_TIMER = setTimeout(sbConnect, wait);
  };
}
function sbDisconnect() {
  if (SB_RETRY_TIMER) { clearTimeout(SB_RETRY_TIMER); SB_RETRY_TIMER = null; }
  if (SB_HB) { clearInterval(SB_HB); SB_HB = null; }
  if (SB_WS) { try { SB_WS.onclose = null; SB_WS.close(); } catch (e) { } SB_WS = null; }
}
function sbApplyRemote(d) {
  if (!d || !d.table) return;
  const type = d.type, rec = d.record, old = d.old_record;
  if (type !== 'DELETE' && rec && rec.updated_by === SB_DEVICE) return;   // thay đổi của chính máy này
  let changed = false, what = '';
  SB_APPLYING = true;
  try {
    if (d.table === SB_T.phieu) {
      if (type === 'DELETE') {
        const i = DB.phieu.findIndex(p => p.id === (old || {}).id);
        if (i >= 0) { what = 'Đã xóa phiếu ' + DB.phieu[i].so; DB.phieu.splice(i, 1); changed = true; }
      } else if (rec) {
        const i = DB.phieu.findIndex(p => p.id === rec.id);
        const np = sbPhieuFromRow(rec, i >= 0 ? DB.phieu[i] : null);
        if (i >= 0) DB.phieu[i] = np; else DB.phieu.push(np);
        what = (type === 'INSERT' ? 'Phiếu mới ' : 'Sửa phiếu ') + np.so;
        changed = true;
        if (rec.has_files) sbLoadFiles('phieu', rec.id);
      }
    } else if (d.table === SB_T.unc) {
      if (type === 'DELETE') {
        const i = DB.unc.findIndex(u => u.id === (old || {}).id);
        if (i >= 0) { what = 'Đã xóa ủy nhiệm chi ' + DB.unc[i].so; DB.unc.splice(i, 1); changed = true; }
      } else if (rec) {
        const i = DB.unc.findIndex(u => u.id === rec.id);
        const nu = sbUncFromRow(rec, i >= 0 ? DB.unc[i] : null);
        if (i >= 0) DB.unc[i] = nu; else DB.unc.push(nu);
        what = (type === 'INSERT' ? 'Ủy nhiệm chi mới ' : 'Sửa ủy nhiệm chi ') + nu.so;
        changed = true;
        if (rec.has_files) sbLoadFiles('unc', rec.id);
      }
    } else if (d.table === SB_T.tv) {
      if (type === 'DELETE') {
        const i = DB.thamVieng.findIndex(t => t.id === (old || {}).id);
        if (i >= 0) { what = 'Đã xóa dòng thăm viếng ' + DB.thamVieng[i].hoTen; DB.thamVieng.splice(i, 1); changed = true; }
      } else if (rec) {
        const i = DB.thamVieng.findIndex(t => t.id === rec.id);
        const nt = sbTvFromRow(rec);
        if (i >= 0) DB.thamVieng[i] = nt; else DB.thamVieng.push(nt);
        what = 'Cập nhật thăm viếng ' + nt.hoTen;
        changed = true;
      }
    } else if (d.table === SB_T.kv && type !== 'DELETE' && rec) {
      sbApplyKv(rec.k, rec.v);
      what = 'Cập nhật ' + sbKvLabel(rec.k);
      changed = true;
    }
    if (changed) saveDB();
  } catch (e) { console.error('Supabase apply:', e); }
  SB_APPLYING = false;
  if (changed) { SB_SNAP = sbSnapshot(); sbRefreshUI(); sbToast('🔄 ' + what); }
}
function sbLoadFiles(kind, id) {
  sbReq(SB_T.file + '?owner_id=eq.' + encodeURIComponent(id) + '&select=id,ten,loai,data&order=id').then(rows => {
    if (!rows) return;
    const arr = (DB[kind === 'phieu' ? 'phieu' : 'unc'] || []);
    const o = arr.find(x => x.id === id);
    if (!o) return;
    SB_APPLYING = true;
    o.files = rows.map(r => ({ name: r.ten, type: r.loai, data: r.data }));
    saveDB();
    SB_APPLYING = false;
    SB_SNAP = sbSnapshot();
  }).catch(e => console.warn('Tải file đính kèm:', e.message));
}
function sbRefreshUI() {
  if (currentMod === 'caidat') {
    // Cài đặt: chỉ vẽ lại khi người dùng KHÔNG đang gõ, để vừa không mất chữ

/* ---------- Trạng thái & thông báo ---------- */
function sbSetState(st, msg) { SB_STATE = st; SB_STATE_MSG = msg || ''; sbPill(); }
function sbPill() {
  const el = $('sbPill'); if (!el) return;
  const pend = SB_OUT.length;
  const map = {
    off: ['off', '○ Đồng bộ: TẮT'],
    connecting: ['wait', '◐ Đang kết nối…'],
    live: ['live', '● Trực tuyến'],
    offline: ['wait', '◌ Mất kết nối — sẽ tự nối lại'],
    err: ['err', '⚠ Lỗi đồng bộ']
  };
  let st = SB_STATE;
  if (st === 'off' && sbOn()) st = 'connecting';
  if (sbOn() && SB_API_OK === false) st = 'err';     // bảng chưa tạo / bị chặn → không báo "Trực tuyến"
  const m = map[st] || map.off;
  el.className = 'sbpill ' + m[0];
  el.textContent = m[1] + (pend ? ' · ' + pend + ' chờ gửi' : '') + (SB_FLUSHING ? ' · đang gửi…' : '');
  el.title = (SB_STATE_MSG || '') + (pend ? '\n' + pend + ' thay đổi chờ đẩy lên.' : '');
}
function sbToast(txt) {
  let t = $('sbToast');

  t.textContent = txt;
  t.className = 'show';
  clearTimeout(sbToast._t);
  sbToast._t = setTimeout(function () { t.className = ''; }, 4000);
}

/* ---------- Nhận cấu hình tự động (link chia sẻ hoặc nhúng sẵn trong file) ---------- */
function sbAdoptLinkCfg() {
  const m = /[#&]sbcfg=([^&]+)/.exec(location.hash || '');
  if (!m) return false;
  let cfg = null;
  try { cfg = JSON.parse(atob(decodeURIComponent(m[1]))); } catch (e) { cfg = null; }
  try { history.replaceState(null, '', location.pathname + location.search); } catch (e) { }  // xóa key khỏi thanh địa chỉ
  if (!cfg || !cfg.url || !cfg.key) return false;
  DB.settings.sb.url = String(cfg.url).trim().replace(/\/+$/, '');
  DB.settings.sb.key = String(cfg.key).trim();
  DB.settings.sb.enabled = true;
  saveDB();
  setTimeout(function () { sbToast('✅ Đã nhận cấu hình đồng bộ từ link — đang kết nối…'); }, 900);
  return true;
}
function sbAdoptPreset() {

  s.url = String(SB_PRESET.url).trim().replace(/\/+$/, '');
  s.key = String(SB_PRESET.key).trim();

      .catch(function () { sbMsg(nhac + ' Hãy copy thủ công ở ô bên dưới.', true); });
