<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>PDF Toolkit — Internal</title>
<style>
  :root{
    --nav:#2a3444; --nav-header:#212a38; --nav-active:#3a4a63; --nav-hover:#333e50;
    --nav-text:#c9d2df; --nav-label:#7e8ca3; --accent:#2563eb;
    --bg:#f1f3f6; --surface:#ffffff; --border:#e2e7ee; --border-in:#d5dbe4;
    --heading:#1f2a37; --text:#374151; --muted:#6b7686;
    --primary:#2a3444; --primary-h:#1f2836;
    --ok:#0f9d6b; --danger:#d64550;
    --radius:8px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%}
  body{background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    font-size:14.5px;line-height:1.55}
  a{color:var(--accent);text-decoration:none}

  .sidebar{position:fixed;top:0;left:0;bottom:0;width:240px;background:var(--nav);
    color:var(--nav-text);display:flex;flex-direction:column;overflow-y:auto}
  .sidebar .head{background:var(--nav-header);padding:18px 20px;border-bottom:1px solid rgba(255,255,255,.06)}
  .sidebar .head .t{color:#fff;font-weight:700;font-size:14px;line-height:1.35;letter-spacing:.01em}
  .sidebar .head .s{color:var(--nav-label);font-size:12px;margin-top:4px}
  .langsw{display:flex;margin-top:12px;border:1px solid rgba(255,255,255,.16);border-radius:6px;overflow:hidden;width:max-content}
  .langsw button{border:0;background:none;color:var(--nav-label);padding:4px 12px;font:inherit;font-size:12px;cursor:pointer}
  .langsw button.on{background:var(--accent);color:#fff}
  .grp{padding:16px 20px 6px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--nav-label)}
  .navitem{display:flex;align-items:center;gap:10px;padding:10px 20px;cursor:pointer;color:var(--nav-text);
    border-left:3px solid transparent;font-size:14px}
  .navitem:hover{background:var(--nav-hover)}
  .navitem.active{background:var(--nav-active);color:#fff;border-left-color:var(--accent)}
  .sidebar .foot{margin-top:auto;padding:14px 20px;font-size:12px;color:var(--nav-label);
    border-top:1px solid rgba(255,255,255,.06);line-height:1.5}

  .main{margin-left:240px;min-height:100vh}
  .topbar{background:var(--surface);border-bottom:1px solid var(--border);padding:18px 30px;
    display:flex;align-items:center;gap:16px;justify-content:space-between}
  .topbar .tb-title{min-width:0}
  .topbar h1{margin:0;font-size:19px;color:var(--heading);font-weight:700}
  .topbar .crumb{font-size:12.5px;color:var(--muted);margin-top:2px}
  .content{padding:26px 30px 70px}

  .panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
    padding:22px 24px;margin-bottom:20px}
  .panel > .lead{color:var(--muted);margin:0 0 18px;font-size:13.5px;max-width:64ch}
  .subhead{font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);
    font-weight:700;margin:0 0 12px;padding-bottom:8px;border-bottom:1px solid var(--border)}

  .field{margin:0 0 15px}
  label{display:block;font-weight:600;margin:0 0 6px;font-size:13.5px;color:var(--heading)}
  .hint{color:var(--muted);font-size:12.5px;margin:5px 0 0}
  input[type=text],select{width:100%;padding:9px 11px;border:1px solid var(--border-in);
    border-radius:6px;font:inherit;background:#fff;color:var(--text)}
  input[type=text]:focus,select:focus{outline:2px solid #dbe4fb;border-color:var(--accent)}

  .drop{border:1.5px dashed var(--border-in);border-radius:6px;padding:24px;text-align:center;
    color:var(--muted);background:#fafbfc;cursor:pointer;transition:.15s}
  .drop.hover{border-color:var(--accent);background:#f2f6ff}
  .drop b{color:var(--heading)}

  ul.filelist{list-style:none;margin:12px 0 0;padding:0}
  ul.filelist li{display:flex;align-items:center;gap:10px;padding:8px 12px;background:#fff;
    border:1px solid var(--border);border-radius:6px;margin-bottom:6px;font-size:13.5px}
  ul.filelist li .grab{cursor:grab;color:var(--muted)}
  ul.filelist li .name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  ul.filelist li .x{border:0;background:none;color:var(--danger);cursor:pointer;font-size:15px}
  ul.filelist li.dragging{opacity:.5}
  .idx{color:var(--muted);width:20px;text-align:right}

  .btn{display:inline-flex;align-items:center;gap:8px;border:0;border-radius:6px;background:var(--primary);
    color:#fff;padding:10px 18px;font:inherit;font-weight:600;font-size:13.5px;cursor:pointer}
  .btn:hover{background:var(--primary-h)}
  .btn:disabled{opacity:.45;cursor:not-allowed}
  .btn.ghost{background:#fff;color:var(--heading);border:1px solid var(--border-in)}
  .btn.ghost:hover{background:#f2f6ff;border-color:var(--accent)}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:10px}

  .result{margin-top:18px;padding:14px 16px;border:1px solid var(--border);border-left:3px solid var(--ok);
    border-radius:6px;background:#fbfefc;display:none}
  .result.show{display:block}
  .result.error{border-left-color:var(--danger);background:#fdf6f6}
  .result h3{margin:0 0 5px;font-size:14px;color:var(--heading)}
  .result .meta{color:var(--muted);font-size:12.8px;white-space:pre-wrap}
  .spin{display:inline-block;width:13px;height:13px;border:2px solid #fff;border-top-color:transparent;
    border-radius:50%;animation:sp .7s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}

  .split2{display:grid;grid-template-columns:1fr;gap:20px}
  /* Organize: page thumbnail tiles */
  .pagechips{display:grid;grid-template-columns:repeat(auto-fill,minmax(116px,1fr));gap:12px;margin-top:14px}
  .tile{position:relative;display:flex;flex-direction:column;gap:7px;padding:8px;background:#fff;
    border:1px solid var(--border-in);border-radius:8px;cursor:grab;user-select:none;transition:.15s}
  .tile:hover{border-color:var(--accent);box-shadow:0 1px 6px rgba(37,99,235,.12)}
  .tile.dragging{opacity:.35}
  /* Square thumb box: an image that fits the square still fits after a 90° turn,
     so rotation is a pure CSS transform and never clips. */
  .tile .thumb{aspect-ratio:1;display:flex;align-items:center;justify-content:center;
    background:#f5f6f8;border-radius:4px;overflow:hidden}
  .tile .thumb img{max-width:100%;max-height:100%;display:block;
    box-shadow:0 1px 3px rgba(0,0,0,.22);background:#fff;transition:transform .2s ease}
  .tile .thumb .ph{width:15px;height:15px;border:2px solid var(--border-in);border-top-color:var(--accent);
    border-radius:50%;animation:sp .8s linear infinite}
  .tile .cap{display:flex;align-items:center;gap:2px;font-size:12.5px;color:var(--heading)}
  .tile .cap .n{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .tile .cap button{border:0;background:none;cursor:pointer;color:var(--muted);font-size:13px;
    padding:2px 3px;border-radius:4px;line-height:1}
  .tile .cap button:hover{background:#eef3fd;color:var(--accent)}
  .tile .rot{position:absolute;top:12px;left:12px;background:var(--accent);color:#fff;font-size:10.5px;
    font-weight:600;padding:1px 5px;border-radius:3px}
  .tile.del{cursor:default;border-style:dashed}
  .tile.del .thumb{opacity:.28}
  .tile.del .cap .n{text-decoration:line-through;color:var(--muted)}
  .tile.del .rot{display:none}
  @media(min-width:700px){ .split2{grid-template-columns:1fr 1fr} }

  @media(max-width:760px){
    .sidebar{position:static;width:auto;flex-direction:row;flex-wrap:wrap;overflow:visible}
    .sidebar .head{width:100%}
    .grp,.sidebar .foot{display:none}
    .navitem{border-left:0;border-bottom:3px solid transparent;padding:12px 14px}
    .navitem.active{border-left:0;border-bottom-color:var(--accent)}
    .main{margin-left:0}
    .content{padding:20px 16px 60px}
    .topbar{padding:16px}
  }
</style>
</head>
<body>

<aside class="sidebar">
  <div class="head">
    <div class="t" data-i18n="brand">PDF Toolkit</div>
    <div class="s" data-i18n="brandSub">Internal documents — LDKS Plaza</div>
    <div class="langsw">
      <button id="langEn" class="on" onclick="setLang('en')">EN</button>
      <button id="langVi" onclick="setLang('vi')">VI</button>
    </div>
  </div>
  <div class="grp" data-i18n="navGroup">Functions</div>
  <div class="navitem active" data-tab="merge">Merge</div>
  <div class="navitem" data-tab="split">Split</div>
  <div class="navitem" data-tab="organize">Organize pages</div>
  <div class="navitem" data-tab="convert">Convert format</div>
  <div class="foot" id="privacyNote"></div>
</aside>

<div class="main">
  <div class="topbar">
    <h1 id="pageTitle"></h1>
    <div class="crumb" id="pageCrumb"></div>
  </div>
  <div class="content">

  <section class="panel-group" id="merge">
    <div class="panel">
      <p class="lead" data-i18n="mergeLead"></p>
      <div class="drop" id="mergeDrop"><b data-i18n="dropPdfsB">Drop PDFs here</b><br><span data-i18n="dropOrClick">or click to choose</span></div>
      <input type="file" id="mergeInput" accept="application/pdf" multiple hidden>
      <ul class="filelist" id="mergeList"></ul>
      <div class="row">
        <input type="text" id="mergeName" data-i18n-ph="mergeNamePh" style="max-width:280px">
        <button class="btn" id="mergeGo" data-i18n="mergeGo" disabled>Merge selected files</button>
      </div>
      <div class="result" id="mergeResult"></div>
    </div>
  </section>

  <section class="panel-group" id="split" style="display:none">
    <div class="panel">
      <p class="lead" data-i18n="splitLead"></p>
      <div class="drop" id="splitDrop"><b data-i18n="chooseOnePdf">Choose one PDF</b></div>
      <input type="file" id="splitInput" accept="application/pdf" hidden>
      <p class="hint" id="splitInfo"></p>
      <div class="field" style="margin-top:14px">
        <label data-i18n="rangeLabel">Page ranges to extract</label>
        <input type="text" id="splitRanges" data-i18n-ph="rangePh" style="max-width:320px">
      </div>
      <div class="row">
        <button class="btn" id="splitGo" data-i18n="splitGo" disabled>Extract by range</button>
        <button class="btn ghost" id="splitEach" data-i18n="splitEach" disabled>One file per page (.zip)</button>
      </div>
      <div class="result" id="splitResult"></div>
    </div>
  </section>

  <section class="panel-group" id="organize" style="display:none">
    <div class="panel">
      <p class="lead" data-i18n="orgLead"></p>
      <div class="drop" id="orgDrop"><b data-i18n="chooseOnePdf">Choose one PDF</b></div>
      <input type="file" id="orgInput" accept="application/pdf" hidden>
      <div class="pagechips" id="orgChips"></div>
      <p class="hint" id="orgStatus" style="margin-top:10px"></p>
      <div class="row" id="orgActions" style="display:none">
        <button class="btn" id="orgGo" data-i18n="orgGo">Export new file</button>
        <span class="hint" data-i18n="orgHint"></span>
      </div>
      <div class="result" id="orgResult"></div>
    </div>
  </section>

  <section class="panel-group" id="convert" style="display:none">
    <div class="panel">
      <p class="lead" data-i18n="convLead"></p>
      <div class="split2">
        <div class="field">
          <div class="subhead" data-i18n="toPdf">Images to PDF</div>
          <div class="drop" id="toPdfDrop"><b data-i18n="chooseImgs">Choose images</b><br><span>PNG, JPG</span></div>
          <input type="file" id="toPdfInput" accept="image/png,image/jpeg" multiple hidden>
          <ul class="filelist" id="toPdfList"></ul>
          <button class="btn" id="toPdfGo" data-i18n="toPdfGo" disabled style="margin-top:8px">Convert to PDF</button>
          <div class="result" id="toPdfResult"></div>
        </div>
        <div class="field">
          <div class="subhead" data-i18n="fromPdf">PDF to images</div>
          <div class="drop" id="fromPdfDrop"><b data-i18n="chooseOnePdf">Choose one PDF</b></div>
          <input type="file" id="fromPdfInput" accept="application/pdf" hidden>
          <p class="hint" id="fromInfo"></p>
          <button class="btn" id="fromGo" data-i18n="fromGo" disabled style="margin-top:8px">Convert to PNG (.zip)</button>
          <div class="result" id="fromResult"></div>
        </div>
      </div>
      <p class="hint" data-i18n="convNote" style="margin-top:14px"></p>
    </div>
  </section>

  </div>
</div>

<script>
// Worker path is relative to this page. Over http(s) it runs as a real worker;
// opened as a plain file:// page the browser blocks workers and pdf.js falls
// back to the main thread (slower, still correct).
if(window.pdfjsLib) pdfjsLib.GlobalWorkerOptions.workerSrc='lib/pdf.worker.min.js';
const { PDFDocument, degrees } = PDFLib;
const $ = s => document.querySelector(s);

const I18N = {
  en:{
    brand:"PDF Toolkit", brandSub:"Internal documents — LDKS Plaza", navGroup:"Functions",
    nav:{merge:"Merge",split:"Split",organize:"Organize pages",convert:"Convert format"},
    crumb:{merge:"Functions · Merge documents",split:"Functions · Split pages",
      organize:"Functions · Reorder / rotate / delete",convert:"Functions · Convert"},
    privacyNote:"All files are processed in your browser. Nothing is uploaded.",
    mergeLead:"Choose PDFs to merge, then drag rows to set the order.",
    dropPdfsB:"Drop PDFs here", dropOrClick:"or click to choose", mergeNamePh:"Output file name (merged.pdf)",
    mergeGo:"Merge selected files",
    splitLead:"Extract selected pages by range, or split each page into its own file.",
    chooseOnePdf:"Choose one PDF", rangeLabel:"Page ranges to extract", rangePh:"e.g. 1-3,5,8-10",

    orgLead:"Choose a PDF, drag the tiles to reorder, click to rotate or mark a page for deletion.",

    orgLoading:(p)=>`Building previews… ${p.done} / ${p.total}`,
    orgKeep:(p)=>p.keep===p.total?`${p.total} pages — drag a tile to reorder`
      :`Keeping ${p.keep} of ${p.total} pages`,

    okFrom:"Converted to images", okFromMeta:(n)=>`${n} pages`,

    privacyNote:"Mọi file được xử lý ngay trong trình duyệt. Không có gì được tải lên máy chủ.",

    mergeGo:"Gộp file đã chọn",
    splitLead:"Lấy ra một số trang theo khoảng, hoặc tách mỗi trang thành một file riêng.",
    chooseOnePdf:"Chọn 1 file PDF", rangeLabel:"Khoảng trang cần lấy", rangePh:"Ví dụ: 1-3,5,8-10",

    orgLead:"Chọn một PDF, kéo các ô để đổi thứ tự, bấm để xoay hoặc đánh dấu xóa trang.",

      :`Giữ lại ${p.keep} trong ${p.total} trang`,
    orgThumbFail:"Không xem trước được",

    convNote:"Bản trình duyệt này chỉ xử lý ảnh ↔ PDF. Word / Excel / PowerPoint ↔ PDF cần bản chạy trên máy chủ.",
    page:(n)=>`Trang ${n}`, rotTitle:"Xoay 90°", delTitle:"Xóa / khôi phục",
    selected:(n)=>`Đã chọn: ${n}`, download:"Tải xuống", working:"Đang xử lý…",
    okMerge:"Đã gộp xong", okMergeMeta:(j)=>`${j.pages} trang · ${j.merged} file`+(j.skipped.length?`\nBỏ qua: ${j.skipped.join(', ')}`:''),

    okSplitEach:"Đã tách mỗi trang", okSplitEachMeta:(n)=>`${n} file trong .zip`,
    okOrg:"Đã xuất file mới", okOrgMeta:(n)=>`${n} trang`,

};

let lang='en';
try{ const s=localStorage.getItem('pdftk_lang'); if(s==='vi'||s==='en') lang=s; }catch(e){}
const T = k => I18N[lang][k];

function fail(code, params){ const e=new Error(code); e.code=code; e.params=params||{}; return e; }
function msgOf(e){ const m=I18N[lang][e&&e.code]; if(m) return typeof m==='function'?m(e.params):m; return T('errReadPdf'); }

function applyStatic(){
  document.documentElement.lang=lang;
  document.querySelectorAll('[data-i18n]').forEach(el=>{const v=T(el.dataset.i18n); if(typeof v==='string') el.textContent=v;});
  document.querySelectorAll('[data-i18n-ph]').forEach(el=>{el.placeholder=T(el.dataset.i18nPh);});
  document.querySelectorAll('.navitem').forEach(b=>{b.textContent=T('nav')[b.dataset.tab];});
  const a=document.querySelector('.navitem.active').dataset.tab;
  $('#pageTitle').textContent=T('nav')[a]; $('#pageCrumb').textContent=T('crumb')[a];
  $('#privacyNote').textContent=T('privacyNote');
  // Organize tiles and status are built in JS, not from data-i18n, so re-render them
  // on a language switch (cached thumbnails are reused — no pdf.js work).
  if(typeof orgPages!=='undefined' && orgPages.length) renderChips();
  $('#langEn').classList.toggle('on',lang==='en'); $('#langVi').classList.toggle('on',lang==='vi');
}
function setLang(l){ lang=l; try{localStorage.setItem('pdftk_lang',l);}catch(e){} applyStatic(); }

document.querySelectorAll('.navitem').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('.navitem').forEach(x=>x.classList.remove('active'));
  document.querySelectorAll('.panel-group').forEach(x=>x.style.display='none');
  b.classList.add('active'); $('#'+b.dataset.tab).style.display='block';
  $('#pageTitle').textContent=T('nav')[b.dataset.tab]; $('#pageCrumb').textContent=T('crumb')[b.dataset.tab];
  window.scrollTo(0,0);
});

function wireDrop(dropSel, inputSel, onFiles){
  const drop=$(dropSel), input=$(inputSel);
  drop.onclick=()=>input.click();
  input.onchange=()=>onFiles([...input.files]);
  ['dragover','dragenter'].forEach(e=>drop.addEventListener(e,ev=>{ev.preventDefault();drop.classList.add('hover')}));
  ['dragleave','drop'].forEach(e=>drop.addEventListener(e,ev=>{ev.preventDefault();drop.classList.remove('hover')}));
  drop.addEventListener('drop',ev=>onFiles([...ev.dataTransfer.files]));
}
function showResult(sel, ok, title, meta, dl, dlName){
  const el=$(sel); el.className='result show'+(ok?'':' error');
  el.innerHTML=`<h3>${title}</h3><div class="meta">${meta||''}</div>`;
  if(dl){ const a=document.createElement('a'); a.className='btn'; a.textContent=T('download');
    a.href=URL.createObjectURL(dl); a.download=dlName; const row=document.createElement('div'); row.className='row'; row.appendChild(a); el.appendChild(row); }
}
function busy(btn,on){ btn.disabled=on; btn.dataset._t=btn.dataset._t||btn.innerHTML; btn.innerHTML=on?`<span class="spin"></span>`:btn.dataset._t; }
const bytesOf = f => f.arrayBuffer();
function parseRanges(spec,total){ const out=[]; for(const c of (spec||'').replace(/\s/g,'').split(',')){ if(!c)continue;
  if(c.includes('-')){let[a,b]=c.split('-').map(Number); if(a>b)[a,b]=[b,a]; for(let i=a;i<=b;i++)out.push(i-1);} else out.push(Number(c)-1);}
  const bad=out.filter(i=>isNaN(i)||i<0||i>=total).map(i=>i+1); if(bad.length) throw fail('e_range',{bad:bad.join(','),total}); return out; }

// ===== MERGE =====
let mergeFiles=[];
wireDrop('#mergeDrop','#mergeInput', fs=>{ mergeFiles.push(...fs.filter(f=>f.name.toLowerCase().endsWith('.pdf'))); renderMerge(); });
function renderMerge(){
  const ul=$('#mergeList'); ul.innerHTML='';
  mergeFiles.forEach((f,i)=>{
    const li=document.createElement('li'); li.draggable=true; li.dataset.i=i;
    li.innerHTML=`<span class="grab">⋮⋮</span><span class="idx">${i+1}</span><span class="name">${f.name}</span><button class="x">✕</button>`;
    li.querySelector('.x').onclick=()=>{mergeFiles.splice(i,1);renderMerge()};
    li.addEventListener('dragstart',()=>li.classList.add('dragging'));
    li.addEventListener('dragend',()=>li.classList.remove('dragging'));
    li.addEventListener('dragover',e=>{e.preventDefault();const d=ul.querySelector('.dragging');if(d===li)return;
      const r=li.getBoundingClientRect();ul.insertBefore(d,(e.clientY>r.top+r.height/2)?li.nextSibling:li);});
    ul.appendChild(li);
  });
  ul.ondragend=()=>{ mergeFiles=[...ul.children].map(li=>mergeFiles[+li.dataset.i]); renderMerge(); };
  $('#mergeGo').disabled = mergeFiles.length<2;
}
$('#mergeGo').onclick=async()=>{
  busy($('#mergeGo'),true);
  try{
    const out=await PDFDocument.create(); let pages=0; const merged=[], skipped=[];
    for(const f of mergeFiles){
      try{ const s=await PDFDocument.load(await bytesOf(f)); const pg=await out.copyPages(s,s.getPageIndices());
        pg.forEach(p=>out.addPage(p)); pages+=s.getPageCount(); merged.push(f.name); }
      catch(_){ skipped.push(f.name); }
    }
    if(pages===0) throw fail('e_no_pages');
    const blob=new Blob([await out.save()],{type:'application/pdf'});
    showResult('#mergeResult',true,T('okMerge'),T('okMergeMeta')({pages,merged:merged.length,skipped}),blob,$('#mergeName').value||'merged.pdf');
  }catch(e){ showResult('#mergeResult',false,T('errMerge'),msgOf(e)); }
  finally{ busy($('#mergeGo'),false); }
};

// ===== SPLIT =====
let splitFile=null;
wireDrop('#splitDrop','#splitInput', fs=>{ splitFile=fs[0]; $('#splitInfo').textContent=T('selected')(splitFile.name);
  $('#splitGo').disabled=false; $('#splitEach').disabled=false; });
$('#splitGo').onclick=async()=>{
  busy($('#splitGo'),true);
  try{ const s=await PDFDocument.load(await bytesOf(splitFile)); const idx=parseRanges($('#splitRanges').value,s.getPageCount());
    const out=await PDFDocument.create(); (await out.copyPages(s,idx)).forEach(p=>out.addPage(p));
    const blob=new Blob([await out.save()],{type:'application/pdf'});
    showResult('#splitResult',true,T('okSplit'),T('okSplitMeta')(idx.length),blob,'split.pdf');
  }catch(e){ showResult('#splitResult',false,T('errSplit'),msgOf(e)); }
  finally{ busy($('#splitGo'),false); }
};
$('#splitEach').onclick=async()=>{
  busy($('#splitEach'),true);
  try{ const s=await PDFDocument.load(await bytesOf(splitFile)); const n=s.getPageCount(); const zip=new JSZip();
    const stem=(splitFile.name||'file').replace(/\.pdf$/i,'');
    for(let i=0;i<n;i++){ const d=await PDFDocument.create(); const [p]=await d.copyPages(s,[i]); d.addPage(p);
      zip.file(`${stem}_page_${String(i+1).padStart(3,'0')}.pdf`, await d.save()); }
    const blob=await zip.generateAsync({type:'blob'});
    showResult('#splitResult',true,T('okSplitEach'),T('okSplitEachMeta')(n),blob,`${stem}_pages.zip`);
  }catch(e){ showResult('#splitResult',false,T('errSplit'),msgOf(e)); }
  finally{ busy($('#splitEach'),false); }
};

// ===== ORGANIZE =====
// orgBytes stays untouched for pdf-lib on export. pdf.js is given a COPY, because
// getDocument() transfers the ArrayBuffer to its worker and detaches the original.
//
// Each page is rendered to a thumbnail EXACTLY ONCE, strictly sequentially, at load
// time; the PNG is cached on the page object. Never re-render on rotate — overlapping
// render() calls on the same pdf.js page object queue up and wedge the library. Rotation
// is a CSS transform on the cached image instead (the .thumb box is square, so a turn
// can't clip it).
let orgBytes=null, orgPages=[], orgDoc=null, orgToken=0, orgBuilt=0;
const THUMB_PX = 260;   // rendered bitmap width; box shows it at ~130px for crispness

wireDrop('#orgDrop','#orgInput', async fs=>{
  const f=fs&&fs[0]; if(!f) return;
  const token=++orgToken;                       // invalidates work from a previous file
  if(orgDoc){ try{ await orgDoc.destroy(); }catch(_){} orgDoc=null; }
  orgPages=[]; $('#orgChips').innerHTML=''; $('#orgActions').style.display='none';
  $('#orgResult').className='result'; $('#orgStatus').textContent=T('working');
  try{
    orgBytes=await bytesOf(f);
    const s=await PDFDocument.load(orgBytes);
    orgPages=Array.from({length:s.getPageCount()},(_,i)=>({n:i+1,rot:0,del:false,thumb:null}));
    orgBuilt=0;
    renderChips();                              // tiles appear at once, thumbnails stream in
    $('#orgActions').style.display='flex';
    const doc=await pdfjsLib.getDocument({data:orgBytes.slice(0)}).promise;
    if(token!==orgToken){ try{ await doc.destroy(); }catch(_){} return; }
    orgDoc=doc;
    await buildThumbs(token);
  }catch(e){
    if(token!==orgToken) return;
    $('#orgStatus').textContent='';
    showResult('#orgResult',false,T('errReadPdf'),msgOf(e&&e.code?e:fail('e_read')));
  }
});

async function buildThumbs(token){
  // for..of holds the array captured here; a mid-build reorder reassigns orgPages to a
  // new array of the SAME page objects, so every page is still rendered exactly once.
  for(const p of orgPages){
    if(token!==orgToken) return;                // a newer file was dropped
    updateStatus();
    try{
      const page=await orgDoc.getPage(p.n);
      const base=page.getViewport({scale:1});
      // bake the page's own /Rotate in so the thumbnail starts upright
      const vp=page.getViewport({scale:THUMB_PX/base.width, rotation:base.rotation});
      const cv=document.createElement('canvas');
      cv.width=Math.ceil(vp.width); cv.height=Math.ceil(vp.height);
      await page.render({canvasContext:cv.getContext('2d'),viewport:vp}).promise;
      if(token!==orgToken) return;
      p.thumb=cv.toDataURL('image/png');
    }catch(_){ p.thumb='fail'; }
    paintThumb(p); orgBuilt++; updateStatus();
    await new Promise(r=>setTimeout(r,0));       // yield so the tab stays responsive
  }
  if(token===orgToken) updateStatus();
}

// Drop the cached image into whichever tile currently holds this page.
function paintThumb(p){
  const i=orgPages.indexOf(p); if(i<0) return;
  const box=$('#orgChips').querySelector(`[data-i="${i}"] .thumb`); if(!box) return;
  if(p.thumb==='fail'){
    box.innerHTML=`<span style="font-size:11.5px;color:var(--muted);padding:0 6px;text-align:center">${T('orgThumbFail')}</span>`;
  }else if(p.thumb){
    const img=document.createElement('img');
    img.src=p.thumb; img.alt=T('page')(p.n); img.draggable=false;
    img.style.transform=`rotate(${p.rot}deg)`;
    box.innerHTML=''; box.appendChild(img);
  }
}
function updateStatus(){
  const el=$('#orgStatus');
  if(!orgPages.length){ el.textContent=''; return; }
  // While thumbnails are still being built, progress wins — renderChips() also calls
  // this on every rotate/delete/reorder and must not clobber the progress line.
  el.textContent = orgBuilt<orgPages.length
    ? T('orgLoading')({done:orgBuilt,total:orgPages.length})
    : T('orgKeep')({keep:orgPages.filter(p=>!p.del).length,total:orgPages.length});
}

function renderChips(){
  const box=$('#orgChips'); box.innerHTML='';
  orgPages.forEach((p,i)=>{
    const c=document.createElement('div');
    c.className='tile'+(p.del?' del':''); c.draggable=!p.del; c.dataset.i=i;
    c.innerHTML=
      `<div class="thumb"><span class="ph"></span></div>`+
      (p.rot?`<span class="rot">${p.rot}°</span>`:'')+
      `<div class="cap"><span class="n">${T('page')(p.n)}</span>`+
        `<button title="${T('rotTitle')}">↻</button><button title="${T('delTitle')}">✕</button></div>`;
    const [rotBtn,delBtn]=c.querySelectorAll('.cap button');
    rotBtn.onclick=e=>{ e.stopPropagation(); p.rot=(p.rot+90)%360; renderChips(); };
    delBtn.onclick=e=>{ e.stopPropagation(); p.del=!p.del; renderChips(); };
    c.addEventListener('dragstart',()=>c.classList.add('dragging'));
    c.addEventListener('dragend',()=>{c.classList.remove('dragging');
      orgPages=[...box.children].map(el=>orgPages[+el.dataset.i]); renderChips();});
    c.addEventListener('dragover',e=>{e.preventDefault();const d=box.querySelector('.dragging');if(!d||d===c)return;
      const r=c.getBoundingClientRect();box.insertBefore(d,(e.clientX>r.left+r.width/2)?c.nextSibling:c);});
    box.appendChild(c);
    paintThumb(p);                               // cached — no pdf.js work here
  });
  updateStatus();
}

$('#orgGo').onclick=async()=>{
  busy($('#orgGo'),true);
  try{ const keep=orgPages.filter(p=>!p.del);
    if(!keep.length) throw fail('e_no_keep');
    const s=await PDFDocument.load(orgBytes);
    const out=await PDFDocument.create(); const pages=await out.copyPages(s, keep.map(p=>p.n-1));
    pages.forEach((pg,k)=>{ const r=keep[k].rot; if(r){ pg.setRotation(degrees((pg.getRotation().angle+r)%360)); } out.addPage(pg); });
    const blob=new Blob([await out.save()],{type:'application/pdf'});
    showResult('#orgResult',true,T('okOrg'),T('okOrgMeta')(keep.length),blob,'organized.pdf');
  }catch(e){ showResult('#orgResult',false,T('errOrg'),msgOf(e)); }
  finally{ busy($('#orgGo'),false); }
};
// ===== CONVERT: images -> PDF =====
let toPdfFiles=[];
wireDrop('#toPdfDrop','#toPdfInput', fs=>{ toPdfFiles.push(...fs); const ul=$('#toPdfList'); ul.innerHTML='';
  toPdfFiles.forEach((f,i)=>{const li=document.createElement('li');li.innerHTML=`<span class="idx">${i+1}</span><span class="name">${f.name}</span>`;ul.appendChild(li)});
  $('#toPdfGo').disabled=toPdfFiles.length===0; });
$('#toPdfGo').onclick=async()=>{
  busy($('#toPdfGo'),true);
  try{ const out=await PDFDocument.create();
    for(const f of toPdfFiles){ const ext=(f.name.split('.').pop()||'').toLowerCase(); const b=await bytesOf(f);
      let img; if(ext==='png') img=await out.embedPng(b); else if(ext==='jpg'||ext==='jpeg') img=await out.embedJpg(b);
      else throw fail('e_img',{file:f.name});
      const pg=out.addPage([img.width,img.height]); pg.drawImage(img,{x:0,y:0,width:img.width,height:img.height}); }
    const blob=new Blob([await out.save()],{type:'application/pdf'});
    showResult('#toPdfResult',true,T('okToPdf'),T('okToPdfMeta')(toPdfFiles.length),blob,'images.pdf');
  }catch(e){ showResult('#toPdfResult',false,T('errConv'),msgOf(e)); }
  finally{ busy($('#toPdfGo'),false); }
};

// ===== CONVERT: PDF -> images (pdf.js) =====
let fromFile=null;
wireDrop('#fromPdfDrop','#fromPdfInput', fs=>{ fromFile=fs[0]; $('#fromInfo').textContent=T('selected')(fromFile.name); $('#fromGo').disabled=false; });
$('#fromGo').onclick=async()=>{
  busy($('#fromGo'),true);
  try{ const data=await bytesOf(fromFile); const pdf=await pdfjsLib.getDocument({data}).promise;
    const zip=new JSZip(); const stem=(fromFile.name||'file').replace(/\.pdf$/i,''); const scale=150/72;
    for(let i=1;i<=pdf.numPages;i++){ const page=await pdf.getPage(i); const vp=page.getViewport({scale});
      const canvas=document.createElement('canvas'); canvas.width=Math.ceil(vp.width); canvas.height=Math.ceil(vp.height);
      await page.render({canvasContext:canvas.getContext('2d'),viewport:vp}).promise;
      const b=await new Promise(r=>canvas.toBlob(r,'image/png'));
      zip.file(`${stem}_page_${String(i).padStart(3,'0')}.png`, b); }
    const blob=await zip.generateAsync({type:'blob'});
    showResult('#fromResult',true,T('okFrom'),T('okFromMeta')(pdf.numPages),blob,`${stem}_images.zip`);
  }catch(e){ showResult('#fromResult',false,T('errConv'),msgOf(fail('e_read'))); }
  finally{ busy($('#fromGo'),false); }
};

applyStatic();
</script>
